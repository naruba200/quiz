<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz CNXH KH - Chương 2</title>
<style>
:root { --bg: #f4f7fb; --card: #ffffff; --text: #1d2433; --muted: #5d6b82; --primary: #1b6ef3; --primary-dark: #0f4fb5; --ok: #16844f; --border: #dce4f3; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(145deg, #ecf3ff 0%, #f8fbff 50%, #eefbf6 100%); color: var(--text); min-height: 100vh; padding: 24px; }
.container { width: min(950px, 100%); margin: 0 auto; }
.header { margin-bottom: 16px; text-align: center; }
h1 { margin: 0; font-size: 24px; color: var(--primary-dark); }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
#progress { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
.card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
.question-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
.options { display: grid; gap: 12px; }
.option { display: flex; align-items: center; padding: 14px 16px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; position: relative; }
.option:hover:not(.disabled) { border-color: var(--primary); background: #f0f6ff; }
.option.selected { border-color: var(--primary); background: #f0f6ff; font-weight: 600; }
.option.correct { border-color: var(--ok); background: #e8f5e9; color: var(--ok); }
.option.wrong { border-color: #d32f2f; background: #ffebee; color: #d32f2f; }
.option input { display: none; }
.controls { margin-top: 24px; display: flex; justify-content: space-between; gap: 12px; }
button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 15px; }
#submitBtn { background: var(--primary); color: white; }
#nextBtn { background: var(--text); color: white; }
#resetBtn { background: #e0e0e0; color: #444; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.feedback { margin-top: 16px; padding: 12px; border-radius: 6px; font-weight: 500; display: none; }
.correct-answer { font-weight: bold; color: var(--ok); }
#resultBox { display: none; margin-top: 24px; text-align: center; padding: 30px; border-radius: 12px; background: white; }
.nav-panel {
  position: fixed; top: 12px; right: 12px;
  background: white; border-radius: 10px; padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  border: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 6px;
  max-width: 200px; max-height: 300px; overflow-y: auto;
  z-index: 1000;
}
.nav-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; border: 2px solid var(--border); background: white; color: var(--text); transition: all 0.15s; user-select: none; }
.nav-circle:hover { transform: scale(1.15); }
.nav-circle.correct { background: #16844f; border-color: #16844f; color: white; }
.nav-circle.wrong { background: #d32f2f; border-color: #d32f2f; color: white; }
.nav-circle.current.correct { background: #0e5c36; border-color: #0e5c36; }
.nav-circle.current.wrong { background: #a12121; border-color: #a12121; }
.nav-circle.current.unanswered { background: #d0d8e8; border-color: #b0bcd4; }
</style>
</head>

<h1>CÂU HỎI TRẮC NGHIỆM CHƯƠNG 2<br>SỨ MỆNH LỊCH SỬ CỦA GIAI CẤP CÔNG NHÂN</h1>

</div>

<script>
const questions = [
{ q: "Nội dung nào dưới đây là phạm trù trung tâm, là nguyên lí xuất phát của chủ nghĩa xã hội khoa học?", a: ["Chủ nghĩa xã hội và thời kì quá độ lên chủ nghĩa xã hội.", "Dân chủ xã hội chủ nghĩa và nhà nước xã hội chủ nghĩa.", "Sứ mệnh lịch sử thế giới của giai cấp công nhân.", "Vấn đề dân tộc trong thời kì quá độ lên chủ nghĩa xã hội."], c: 2 },
{ q: "Giai cấp nào dưới đây là con đẻ của nền đại công nghiệp tư bản chủ nghĩa?", a: ["Giai cấp tư sản.", "Giai cấp công nhân.", "Giai cấp địa chủ.", "Giai cấp nông dân."], c: 1 },
{ q: "Lao động trực tiếp hoặc gián tiếp vận hành các công cụ sản xuất có tính chất công nghiệp ngày càng hiện đại và xã hội hóa cao là nội dung thể hiện", a: ["công cụ lao động của người công nhân.", "phương thức lao động của người công nhân.", "vị trí trong quan hệ sản xuất tư bản chủ nghĩa của người công nhân.", "địa vị xã hội của người công nhân."], c: 1 },
{ q: "Về vị trí trong quan hệ sản xuất tư bản chủ nghĩa, công nhân là những người lao động", a: ["không sở hữu tư liệu sản xuất chủ yếu của xã hội.", "có sở hữu tư liệu sản xuất là sức lao động.", "có sở hữu tư liệu sản xuất là kinh nghiệm cá nhân.", "không sở hữu bất cứ tư liệu sản xuất nào của xã hội."], c: 0 },
{ q: "\"Các giai cấp khác đều suy tàn và tiêu vong cùng với sự phát triển của đại công nghiệp, còn giai cấp vô sản là sản phẩm của bản thân nền đại công nghiệp\" là luận điểm của", a: ["C. Mác và Ph. Ăngghen.", "C. Mác.", "Ph. Ăngghen.", "V.I. Lênin."], c: 0 },
{ q: "Giai cấp, tầng lớp nào dưới đây không sở hữu tư liệu sản xuất chủ yếu, phải bán sức lao động cho nhà tư bản và bị nhà tư bản bóc lột giá trị thặng dư?", a: ["Trí thức.", "Doanh nhân.", "Tiểu tư sản.", "Công nhân."], c: 3 },
{ q: "Giai cấp, tầng lớp nào dưới đây chỉ có thể sống với điều kiện là kiếm được việc làm và chỉ kiếm được việc làm nếu lao động của họ làm tăng thêm tư bản?", a: ["Nông dân.", "Địa chủ.", "Công nhân.", "Tư sản."], c: 2 },
{ q: "Lực lượng nào dưới đây buộc phải tự bán mình để kiếm ăn từng bữa, là một hàng hóa, tức là một món hàng đem bán như bất cứ món hàng nào khác, vì thế, họ phải chịu hết mọi sự may rủi của cạnh tranh, mọi sự lên xuống của thị trường?", a: ["Nông dân.", "Người làm nghề tự do.", "Công nhân.", "Tiểu tư sản."], c: 2 },
{ q: "Nội dung nào dưới đây là nguồn gốc cơ bản của giá trị thặng dư và sự giàu có của giai cấp tư sản?", a: ["Lao động sống của giai cấp công nhân.", "Quá trình trao đổi, mua bán.", "Hoạt động thương mại.", "Kinh tế thị trường."], c: 0 },
{ q: "Giai cấp công nhân lao động bằng phương thức công nghiệp với đặc trưng công cụ lao động là", a: ["ruộng đất.", "con trâu, cái cày.", "máy móc có tính chất công nghiệp.", "trí óc."], c: 2 },
{ q: "Giai cấp nào dưới đây là sản phẩm của bản thân nền đại công nghiệp, là chủ thể của quá trình sản xuất vật chất hiện đại?", a: ["Giai cấp chủ nô.", "Giai cấp địa chủ.", "Giai cấp tư sản.", "Giai cấp công nhân."], c: 3 },
{ q: "Lực lượng nào dưới đây là đại biểu cho lực lượng sản xuất tiên tiến, cho phương thức sản xuất tiên tiến, quyết định sự tồn tại và phát triển của xã hội hiện đại?", a: ["Giai cấp nông dân.", "Đội ngũ trí thức.", "Giai cấp tư sản.", "Giai cấp công nhân."], c: 3 },
{ q: "Nền sản xuất đại công nghiệp và phương thức sản xuất tiên tiến đã rèn luyện cho giai cấp công nhân những phẩm chất đặc biệt về tính tổ chức, kỉ luật lao động, tinh thần hợp tác và", a: ["tâm lí lao động công nghiệp.", "tác phong nông nghiệp.", "tâm lí lao động nông nghiệp.", "tâm lí lao động tự do."], c: 0 },
{ q: "Mâu thuẫn giữa lực lượng sản xuất mang tính xã hội hóa ngày càng cao với quan hệ sản xuất dựa trên chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất chủ yếu là mâu thuẫn cơ bản của phương thức sản xuất nào dưới đây?", a: ["Chiếm hữu nô lệ.", "Phong kiến.", "Tư bản chủ nghĩa.", "Cộng sản chủ nghĩa."], c: 2 },
{ q: "Biểu hiện về mặt xã hội của mâu thuẫn cơ bản trong phương thức sản xuất tư bản chủ nghĩa là mâu thuẫn giữa", a: ["tư bản và lao động.", "lực lượng sản xuất và quan hệ sản xuất.", "giai cấp công nhân và giai cấp tư sản.", "các tập đoàn tư bản."], c: 2 },
{ q: "Mâu thuẫn giữa giai cấp công nhân và giai cấp tư sản là mâu thuẫn", a: ["đối kháng trực tiếp về lợi ích.", "không đối kháng về lợi ích.", "về lợi ích không cơ bản.", "đối kháng gián tiếp về lợi ích."], c: 0 },
{ q: "Giữa giai cấp công nhân và giai cấp nông dân có", a: ["toàn bộ lợi ích thống nhất với nhau.", "nhiều lợi ích cơ bản thống nhất với nhau.", "lợi ích hoàn toàn khác nhau.", "lợi ích hoàn toàn đối lập nhau."], c: 1 },
{ q: "Quan điểm nào dưới đây không đúng về giai cấp công nhân?", a: ["Giai cấp công nhân là giai cấp không đại diện cho quan hệ sản xuất tiên tiến.", "Giai cấp công nhân là một tập đoàn xã hội ổn định, hình thành và phát triển cùng với quá trình phát triển của nền công nghiệp hiện đại.", "Giai cấp công nhân là lực lượng chủ yếu của tiến trình lịch sử quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội.", "Giai cấp công nhân là chủ thể của quá trình sản xuất vật chất hiện đại."], c: 0 },
{ q: "Phát biểu nào dưới đây không đúng về giai cấp công nhân?", a: ["Giai cấp công nhân là người làm thuê do không có tư liệu sản xuất, buộc phải bán sức lao động để sống, không bị giai cấp tư sản bóc lột giá trị thặng dư.", "Giai cấp công nhân là người làm thuê do không có tư liệu sản xuất, buộc phải bán sức lao động để sống và bị giai cấp tư sản bóc lột giá trị thặng dư.", "Lợi ích cơ bản của giai cấp công nhân đối lập với lợi ích cơ bản của giai cấp tư sản.", "Giai cấp công nhân là giai cấp có sứ mệnh phủ định chế độ tư bản chủ nghĩa, xây dựng thành công chủ nghĩa xã hội và chủ nghĩa cộng sản trên toàn thế giới."], c: 0 },
{ q: "Phát biểu nào dưới đây không phải là đặc điểm của giai cấp công nhân mang sứ mệnh lịch sử thế giới?", a: ["Giai cấp công nhân là giai cấp đại diện cho lực lượng sản xuất tiến bộ của thời đại.", "Giai cấp công nhân là lực lượng đông đảo và tiên phong.", "Giai cấp công nhân là lực lượng đại diện cho khuynh hướng tiến bộ của nhân loại.", "Giai cấp công nhân là lực lượng tiến bộ nhưng chỉ bảo vệ lợi ích cho giai cấp mình."], c: 3 },
{ q: "Nội dung nào dưới đây không phải là sứ mệnh lịch sử thế giới của giai cấp công nhân?", a: ["Xoá bỏ tận gốc chế độ người bóc lột người, giải phóng cho giai cấp tư sản.", "Giải phóng cho giai cấp công nhân và toàn thể nhân loại bị áp bức.", "Xoá bỏ tận gốc chế độ người bóc lột người, xoá bỏ chủ nghĩa tư bản.", "Xây dựng xã hội cộng sản chủ nghĩa văn minh."], c: 0 },
{ q: "Mục tiêu nào dưới đây là mục tiêu lớn nhất mà giai cấp công nhân thực hiện?", a: ["Xoá bỏ tận gốc chế độ tư bản chủ nghĩa.", "Xoá bỏ tận gốc chế độ người bóc lột người.", "Xoá bỏ tận gốc chế độ phong kiến.", "Xoá bỏ tận gốc chế độ nô lệ làm thuê."], c: 1 },
{ q: "Quan điểm nào sau đây phản ánh đúng về việc xoá bỏ hình thái kinh tế - xã hội tư bản chủ nghĩa?", a: ["Xoá bỏ cả quan hệ sản xuất bóc lột và lực lượng sản xuất trong chủ nghĩa tư bản.", "Xoá bỏ lực lượng sản xuất và kế thừa thành tựu tiến bộ về quan hệ sản xuất trong chủ nghĩa tư bản.", "Xoá bỏ quan hệ sản xuất bóc lột và kế thừa thành tựu tiến bộ về lực lượng sản xuất trong chủ nghĩa tư bản.", "Xoá bỏ văn hóa và tư tưởng bóc lột trong chủ nghĩa tư bản."], c: 2 },
{ q: "Trong chủ nghĩa tư bản, mục tiêu của công nhân là xoá bỏ quan hệ sản xuất dựa trên chế độ", a: ["công hữu về tư liệu sản xuất chủ yếu.", "sở hữu chung về tư liệu sản xuất chủ yếu.", "sở hữu công cộng về tư liệu sản xuất chủ yếu.", "sở hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất chủ yếu."], c: 3 },
{ q: "Muốn thực hiện sứ mệnh lịch sử thế giới của mình, giai cấp công nhân phải", a: ["lật đổ sự thống trị của giai cấp vô sản, giành chính quyền về tay giai cấp mình, thiết lập nhà nước, cải tạo xã hội cũ, xây dựng xã hội mới.", "lật đổ sự thống trị của giai cấp tiểu tư sản, giành chính quyền về tay giai cấp mình, cải tạo xã hội cũ, xây dựng xã hội mới.", "lật đổ sự thống trị của bộ phận đại tư sản, giành chính quyền về tay giai cấp mình, cải tạo xã hội cũ, xây dựng xã hội mới.", "lật đổ sự thống trị của giai cấp tư sản, giành chính quyền về tay giai cấp mình, thiết lập nhà nước chuyên chính vô sản, cải tạo xã hội cũ, xây dựng xã hội mới."], c: 3 },
{ q: "Để thực hiện sứ mệnh lịch sử của mình, bước đầu tiên giai cấp công nhân phải làm là", a: ["xoá bỏ sự bóc lột đem lại hạnh phúc, ấm no cho nhân dân.", "cải tạo xã hội cũ, xây dựng thành công xã hội mới - xã hội cộng sản chủ nghĩa.", "liên minh với nông dân, giải phóng cho loài người.", "giành chính quyền, thiết lập được nhà nước của giai cấp mình."], c: 3 },
{ q: "Xoá bỏ quan hệ sản xuất dựa trên chế độ chiếm hữu tư nhân tư bản về tư liệu sản xuất chủ yếu, xây dựng quan hệ sản xuất mới, phù hợp với tính chất xã hội hóa cao của lực lượng sản xuất, với chế độ công hữu về tư liệu sản xuất chủ yếu của xã hội là nhiệm vụ của giai cấp công nhân trên lĩnh vực", a: ["chính trị - xã hội.", "kinh tế.", "văn hóa.", "tư tưởng."], c: 1 },
{ q: "Thực hiện công nghiệp hóa, gắn liền công nghiệp hóa với hiện đại hóa, đẩy mạnh công nghiệp hóa gắn với phát triển kinh tế tri thức, bảo vệ tài nguyên, môi trường là nhiệm vụ của giai cấp công nhân trên lĩnh vực", a: ["chính trị - xã hội.", "kinh tế.", "văn hóa.", "tư tưởng."], c: 1 },
{ q: "Lật đổ quyền thống trị của giai cấp tư sản, giành quyền lực về tay giai cấp công nhân và nhân dân lao động, thiết lập nhà nước mang bản chất giai cấp công nhân, xây dựng nền dân chủ xã hội chủ nghĩa, thực hiện quyền lực của nhân dân, quyền dân chủ và làm chủ xã hội của tuyệt đại đa số nhân dân lao động là nhiệm vụ của giai cấp công nhân trên lĩnh vực", a: ["kinh tế.", "văn hóa.", "chính trị - xã hội.", "tư tưởng."], c: 2 },
{ q: "Sử dụng nhà nước của mình để cải tạo xã hội cũ và tổ chức xây dựng xã hội mới, phục vụ quyền và lợi ích của nhân dân lao động theo lí tưởng và mục tiêu của chủ nghĩa xã hội là nhiệm vụ của giai cấp công nhân trên lĩnh vực", a: ["kinh tế.", "văn hóa.", "chính trị - xã hội.", "tư tưởng."], c: 2 },
{ q: "Xây dựng hệ giá trị mới: lao động; công bằng; dân chủ; bình đẳng và tự do là nhiệm vụ của giai cấp công nhân trên lĩnh vực", a: ["văn hóa, tư tưởng.", "kinh tế.", "chính trị.", "xã hội."], c: 0 },
{ q: "Xây dựng và củng cố ý thức hệ tiên tiến của giai cấp công nhân, đấu tranh để khắc phục ý thức hệ tư sản và các tàn dư còn sót lại của các hệ tư tưởng cũ là nhiệm vụ của giai cấp công nhân trên lĩnh vực", a: ["kinh tế.", "chính trị.", "văn hóa, tư tưởng.", "xã hội."], c: 2 },
{ q: "Tiếp thu có chọn lọc, trên tinh thần phê phán những tinh hoa giá trị, những thành tựu văn hóa tư tưởng của mọi thời đại, kể cả thời đại tư sản trong lịch sử văn hóa và văn minh của nhân loại là điều mà giai cấp công nhân cần chú ý khi thực hiện sứ mệnh của mình trong lĩnh vực nào dưới đây?", a: ["Kinh tế.", "Chính trị.", "Xã hội.", "Văn hóa, tư tưởng."], c: 3 },
{ q: "Cải tạo cái cũ, lỗi thời, lạc hậu, xây dựng cái mới, tiến bộ trong lĩnh vực ý thức tư tưởng, trong tâm lí, lối sống và trong đời sống tinh thần xã hội là nhiệm vụ của giai cấp công nhân trong lĩnh vực", a: ["tâm lí, ý thức.", "chính trị.", "văn hóa, tư tưởng.", "Kinh tế - xã hội."], c: 2 },
{ q: "Xây dựng con người mới, đạo đức và lối sống mới xã hội chủ nghĩa là một trong những nhiệm vụ đặt ra đối với sứ mệnh lịch sử của giai cấp công nhân trong lĩnh vực nào dưới đây?", a: ["Tâm lí, ý thức.", "Văn hóa, tư tưởng.", "Đạo đức.", "Xã hội."], c: 1 },
{ q: "Sứ mệnh lịch sử của giai cấp công nhân không phải là thay thế chế độ sở hữu tư nhân này bằng một chế độ sở hữu tư nhân khác mà là", a: ["xoá bỏ một phần chế độ tư hữu về tư liệu sản xuất chủ yếu.", "xoá bỏ hoàn toàn chế độ công hữu về tư liệu sản xuất chủ yếu.", "xoá bỏ triệt để tư hữu về tư liệu sản xuất chủ yếu.", "xoá bỏ phần lớn chế độ tư hữu về tư liệu sản xuất chủ yếu."], c: 2 },
{ q: "Mục tiêu cao nhất trong việc thực hiện sứ mệnh lịch sử thế giới của giai cấp công nhân là", a: ["giải phóng dân tộc khỏi ách áp bức của chủ nghĩa thực dân.", "giải phóng nông dân khỏi chế độ phong kiến.", "giải phóng con người.", "giành chính quyền, thiết lập nhà nước mới."], c: 2 },
{ q: "Câu nói: \"Cùng với sự phát triển của đại công nghiệp (...) giai cấp tư sản sản sinh ra người đào huyệt chôn chính nó. Sự sụp đổ của giai cấp tư sản và thắng lợi của giai cấp vô sản đều là tất yếu như nhau\" phản ánh nội dung nào dưới đây?", a: ["Khẳng định tính tất yếu chủ quan trong sứ mệnh lịch sử của giai cấp công nhân.", "Khẳng định tính tất yếu khách quan trong sứ mệnh lịch sử của giai cấp công nhân.", "Khẳng định nguyện vọng được giải phóng mình của nhân dân lao động.", "Nhấn mạnh vai trò của Đảng Cộng sản trong việc thực hiện sứ mệnh lịch sử thế giới của giai cấp công nhân."], c: 1 },
{ q: "Sứ mệnh lịch sử thế giới của giai cấp công nhân được quy định bởi", a: ["địa vị kinh tế, chính trị - xã hội của giai cấp công nhân.", "nguyện vọng của giai cấp công nhân.", "sự lãnh đạo của Đảng Cộng sản đối với giai cấp công nhân.", "nguyện vọng của nhân dân lao động."], c: 0 },
{ q: "Giai cấp công nhân là sản phẩm của nền đại công nghiệp trong phương thức sản xuất tư bản chủ nghĩa, là chủ thể của quá trình sản xuất vật chất hiện đại, vì thế, giai cấp công nhân đại diện cho", a: ["phương thức sản xuất lỗi thời và lực lượng sản xuất hiện đại.", "phương thức sản xuất tiên tiến và lực lượng sản xuất lạc hậu.", "phương thức sản xuất tiên tiến và lực lượng sản xuất hiện đại.", "phương thức sản xuất lỗi thời và lực lượng sản xuất lạc hậu."], c: 2 },
{ q: "Giai cấp công nhân là sản phẩm của nền đại công nghiệp trong phương thức sản xuất tư bản chủ nghĩa, là chủ thể của quá trình sản xuất vật chất hiện đại, vì thế, giai cấp công nhân là lực lượng", a: ["phá vỡ quan hệ sản xuất phong kiến, giành chính quyền về tay giai cấp mình.", "phá vỡ quan hệ sản xuất xã hội chủ nghĩa, giành chính quyền về tay giai cấp mình.", "phá vỡ quan hệ sản xuất tư bản chủ nghĩa, giành chính quyền cho giai cấp nông dân.", "phá vỡ quan hệ sản xuất tư bản chủ nghĩa, giành chính quyền về tay giai cấp mình."], c: 3 },
{ q: "Tinh thần đoàn kết, ý thức tổ chức kỉ luật cao là nội dung thể hiện", a: ["địa vị kinh tế - xã hội của giai cấp công nhân.", "thói quen của giai cấp công nhân.", "đặc điểm chính trị - xã hội của giai cấp công nhân.", "đặc điểm vốn có của con người nói chung."], c: 2 },
{ q: "Phát biểu nào dưới đây không đúng về điều kiện khách quan quy định sứ mệnh lịch sử thế giới của giai cấp công nhân?", a: ["Giai cấp công nhân đại diện cho lực lượng sản xuất hiện đại.", "Giai cấp công nhân đại diện cho phương thức sản xuất tiên tiến.", "Giai cấp công nhân là giai cấp đại biểu cho tương lai, cho xu thế đi lên của tiến trình phát triển lịch sử.", "Giai cấp công nhân là giai cấp vô cùng nghèo khổ."], c: 3 },
{ q: "Giai cấp công nhân đại diện cho lực lượng sản xuất hiện đại, là lực lượng quyết định phá vỡ", a: ["quan hệ sản xuất tư bản chủ nghĩa.", "máy móc trong các nhà máy xí nghiệp của các nhà tư sản.", "quan hệ giữa tư sản và các giai tầng khác trong xã hội tư bản chủ nghĩa.", "chủ nghĩa tư bản độc quyền."], c: 0 },
{ q: "Giai cấp nông dân không thể là giai cấp có sứ mệnh lịch sử thế giới xoá bỏ chế độ tư bản chủ nghĩa, xây dựng chế độ xã hội mới - cộng sản chủ nghĩa bởi", a: ["họ không đại diện cho phương thức sản xuất tiên tiến.", "họ có tư tưởng sở hữu lớn.", "họ có số lượng không đông đảo.", "họ có hệ tư tưởng riêng nhưng thiếu tinh thần đoàn kết."], c: 0 },
{ q: "Nội dung nào dưới đây không phải là đặc điểm chính trị - xã hội của giai cấp công nhân?", a: ["Tiên phong cách mạng và có tinh thần cách mạng triệt để nhất.", "Đại diện cho lực lượng sản xuất hiện đại.", "Có bản chất quốc tế.", "Có ý thức, kỉ luật cao."], c: 1 },
{ q: "Nội dung nào dưới đây không phải là nguyên nhân của việc giai cấp công nhân có tính tổ chức kỉ luật cao?", a: ["Đặc thù môi trường làm việc là dây chuyền sản xuất công nghiệp.", "Bản chất sẵn có của công nhân.", "Sự quản lí chặt chẽ của giai cấp tư sản.", "Yêu cầu của đấu tranh cách mạng."], c: 1 },
{ q: "Nội dung nào dưới đây không phải là điều kiện chủ quan quy định sứ mệnh lịch sử thế giới của giai cấp công nhân?", a: ["Sự lớn mạnh về số lượng của giai cấp công nhân.", "Sự ra đời của Đảng Cộng sản - đội tiên phong của giai cấp công nhân.", "Giai cấp công nhân đại diện cho phương thức sản xuất tiên tiến.", "Giai cấp công nhân đã nhận thức được vai trò và trọng trách của giai cấp mình đối với lịch sử."], c: 2 },
{ q: "Lực lượng ngày càng đông đảo, tỉ lệ và cơ cấu của giai cấp công nhân phù hợp với yêu cầu của sản xuất công nghiệp hiện đại và cơ cấu kinh tế là nội dung thể hiện sự phát triển của giai cấp công nhân về", a: ["chất lượng.", "cơ cấu.", "số lượng.", "tổ chức."], c: 2 },
{ q: "Tự giác nhận thức được vai trò và trọng trách của giai cấp mình đối với lịch sử, năng lực, trình độ làm chủ khoa học kĩ thuật và công nghệ hiện đại là nội dung thể hiện sự phát triển của giai cấp công nhân về", a: ["chất lượng.", "số lượng.", "cơ cấu.", "tổ chức."], c: 0 },
{ q: "Tổ chức nào dưới đây là đội tiên phong của giai cấp công nhân, đảm nhận vai trò lãnh đạo giai cấp công nhân và quần chúng nhân dân lao động tiến hành cuộc cách mạng nhằm xoá bỏ chế độ tư bản chủ nghĩa, chế độ người bóc lột người, xây dựng chế độ xã hội mới - cộng sản chủ nghĩa?", a: ["Nhà nước.", "Mặt trận Tổ quốc.", "Đảng Cộng sản.", "Công đoàn."], c: 2 },
{ q: "Theo quan điểm của chủ nghĩa Mác - Lênin, quy luật chung, phổ biến cho sự ra đời của Đảng Cộng sản là sự kết hợp giữa chủ nghĩa Mác - Lênin với", a: ["phong trào yêu nước.", "phong trào công nhân.", "phong trào giải phóng dân tộc.", "phong trào cải cách."], c: 1 },
{ q: "Lực lượng nào dưới đây là cơ sở xã hội và nguồn bổ sung lực lượng quan trọng nhất của Đảng, làm cho Đảng mang bản chất giai cấp công nhân, trở thành đội tiên phong, bộ tham mưu chiến đấu của lực lượng này?", a: ["Giai cấp công nhân.", "Giai cấp nông dân.", "Đội ngũ trí thức.", "Tầng lớp doanh nhân."], c: 0 },
{ q: "Tổ chức nào dưới đây là đại biểu trung thành cho lợi ích của giai cấp công nhân, của dân tộc và xã hội?", a: ["Công đoàn.", "Đảng Cộng sản.", "Đoàn Thanh niên.", "Mặt trận Tổ quốc."], c: 1 },
{ q: "C. Mác và Ph. Ăngghen đã nhấn mạnh rằng: Giai cấp vô sản chỉ có thể hành động với tư cách là một giai cấp được khi giai cấp vô sản", a: ["liên minh được với giai cấp nông dân.", "tự mình tổ chức thành một chính đảng độc lập của mình.", "liên minh được với giai cấp vô sản ở các nước khác.", "thành lập được tổ chức công đoàn ở các nhà máy xí nghiệp."], c: 1 },
{ q: "Điều kiện có ý nghĩa quyết định đối với việc hoàn thành sứ mệnh lịch sử của giai cấp công nhân là", a: ["phải thực hiện liên minh giai cấp.", "phải đoàn kết với giai cấp vô sản quốc tế.", "phải có một đảng chính trị vững vàng, kiên định và sáng suốt.", "phải có tổ chức đoàn thể trong mỗi nhà máy xí nghiệp."], c: 2 },
{ q: "Trong quá trình thực hiện sứ mệnh lịch sử thế giới của mình, liên minh giai cấp giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp nhân dân lao động khác trong xã hội là một tất yếu, do", a: ["giai cấp nông dân lãnh đạo.", "đội ngũ trí thức lãnh đạo.", "giai cấp công nhân lãnh đạo.", "tầng lớp doanh nhân lãnh đạo."], c: 2 },
{ q: "Điều kiện chủ quan có vai trò quyết định nhất trong việc thực hiện sứ mệnh lịch sử thế giới của giai cấp công nhân là", a: ["sự tăng nhanh về số lượng.", "giai cấp công nhân liên minh được với giai cấp nông dân.", "sự phát triển cao về trình độ tay nghề.", "sự trưởng thành của giai cấp công nhân, đặc biệt là khi có Đảng tiên phong lãnh đạo."], c: 3 },
{ q: "Đảng Cộng sản là", a: ["tổ chức quản lí kinh tế - xã hội.", "tổ chức chính trị cao nhất của toàn dân tộc.", "tổ chức chính trị cao nhất của giai cấp nông dân.", "tổ chức chính trị cao nhất của giai cấp công nhân."], c: 3 },
{ q: "Đảng Cộng sản Việt Nam ra đời là sự kết hợp giữa", a: ["chủ nghĩa yêu nước với phong trào công nhân.", "chủ nghĩa Mác - Lênin với phong trào công nhân.", "chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh với phong trào công nhân.", "Chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước."], c: 3 },
{ q: "Đối với Đảng Cộng sản, giai cấp công nhân là cơ sở xã hội và là", a: ["lực lượng lãnh đạo Đảng.", "đồng minh vững chắc của Đảng.", "lực lượng cổ vũ phong trào đấu tranh của Đảng.", "nguồn bổ sung lực lượng cho Đảng."], c: 3 },
{ q: "Điền từ ngữ thích hợp vào chỗ trống: ... là cơ sở xã hội của Đảng Cộng sản, là .. của Đảng cộng sản.", a: ["Giai cấp công nhân; nguồn bổ sung lực lượng", "Giai cấp công nhân; lực lượng lãnh đạo", "Giai cấp nông nhân; đồng minh vững chắc", "Giai cấp nông nhân; lực lượng cổ vũ phong trào đấu tranh"], c: 0 },
{ q: "Điền từ ngữ thích hợp vào chỗ trống: Đảng Cộng sản Việt Nam ra đời là sản phẩm của sự kết hợp giữa chủ nghĩa Mác - Lênin với phong trào công nhân và ...........................................", a: ["phong trào yêu nước.", "chủ nghĩa yêu nước.", "truyền thống yêu nước.", "lòng yêu nước."], c: 0 },
{ q: "Quan điểm nào sau đây không đúng về Đảng Cộng sản?", a: ["Đảng Cộng sản là nơi tập trung những người ưu tú nhất trong giai cấp công nhân.", "Đảng Cộng sản là nơi tập trung những người giác ngộ cao nhất lí luận của chủ nghĩa Mác - Lênin.", "Đảng Cộng sản là nơi tập trung những quần chúng nhân dân ưu tú nhất.", "Đảng Cộng sản là nơi tập trung những trí thức xuất sắc nhất trong xã hội."], c: 3 },
{ q: "Cải cách, đổi mới để xây dựng chủ nghĩa xã hội ở các nước xã hội chủ nghĩa, nơi giai cấp công nhân thông qua đội tiên phong của mình là Đảng Cộng sản đang cầm quyền, đây là sứ mệnh của giai cấp công nhân hiện nay trong lĩnh vực nào dưới đây?", a: ["Kinh tế.", "Văn hóa.", "Chính trị - xã hội.", "Tư tưởng."], c: 2 },
{ q: "Mục tiêu đấu tranh trực tiếp của giai cấp công nhân và phong trào công nhân ở các nước tư bản hiện nay là", a: ["giành chính quyền, thiết lập nhà nước.", "xoá bỏ chế độ tư bản chủ nghĩa.", "chống bất công và bất bình đẳng xã hội.", "xây dựng chế độ xã hội mới công bằng, bình đẳng."], c: 2 },

{ q: "Cuối thế kỉ XIX - đầu thế kỉ XX, giai cấp công nhân Việt Nam có lợi ích đối kháng trực tiếp với", a: ["tư sản Việt Nam.", "thực dân Pháp.", "bè lũ tay sai của thực dân Pháp.", "địa chủ Việt Nam."], c: 1 },

{ q: "Nguyên nhân nào dưới đây tạo thành động lực thúc đẩy đoàn kết giai cấp gắn liền với đoàn kết dân tộc trong mọi thời kì đấu tranh cách mạng ở Việt Nam?", a: ["Lợi ích dân tộc tách rời lợi ích giai cấp công nhân.", "Lợi ích giai cấp công nhân và lợi ích dân tộc gắn chặt với nhau.", "Lợi ích giai cấp công nhân cao hơn lợi ích dân tộc.", "Toàn thể dân tộc tập trung giải quyết vấn đề lợi ích của giai cấp công nhân."], c: 1 },

let currentIndex = 0;
let score = 0;
let selections = Array(questions.length).fill(null);
let submitted = Array(questions.length).fill(false);
function initQuiz() {
currentIndex = 0; score = 0;
selections = Array(questions.length).fill(null);
submitted = Array(questions.length).fill(false);
buildNavCircles();
renderQuestion();
document.getElementById("resultBox").style.display = "none";
}
function buildNavCircles() {
  const panel = document.getElementById("navPanel");
  panel.innerHTML = "";
  for (let i = 0; i < questions.length; i++) {
    const c = document.createElement("div");
    c.className = "nav-circle unanswered";
    c.textContent = i + 1;
    c.dataset.index = i;
    c.onclick = () => { currentIndex = +c.dataset.index; renderQuestion(); };
    panel.appendChild(c);
  }
}
function updateNavCircles() {
  const circles = document.querySelectorAll(".nav-circle");
  circles.forEach((c, i) => {
    c.classList.remove("correct", "wrong", "unanswered", "current");
    if (submitted[i]) {
      c.classList.add(selections[i] === questions[i].c ? "correct" : "wrong");
    } else {
      c.classList.add("unanswered");
    }
    if (i === currentIndex) c.classList.add("current");
  });
}
function renderQuestion() {
const q = questions[currentIndex];
document.getElementById("counter").innerText = `Câu ${currentIndex + 1} / ${questions.length}`;
document.getElementById("progress").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
document.getElementById("qText").innerText = q.q;
const optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";
q.a.forEach((opt, i) => {
const div = document.createElement("div");
div.className = "option";
if (selections[currentIndex] === i) div.classList.add("selected");
if (submitted[currentIndex]) {
div.classList.add("disabled");
if (i === q.c) div.classList.add("correct");
if (selections[currentIndex] === i && i !== q.c) div.classList.add("wrong");
}
div.innerHTML = `<input type="radio" name="q" value="${i}" ${selections[currentIndex] === i ? 'checked' : ''}> <span>${String.fromCharCode(65 + i)}. ${opt}</span>`;
div.onclick = () => { if (!submitted[currentIndex]) { selections[currentIndex] = i; renderQuestion(); } };
optionsDiv.appendChild(div);
});
const fb = document.getElementById("fb");
if (submitted[currentIndex]) {
fb.style.display = "block";
fb.style.background = selections[currentIndex] === q.c ? "#e8f5e9" : "#ffebee";
fb.innerHTML = selections[currentIndex] === q.c ? "✅ Chính xác!" : `❌ Sai rồi! Đáp án đúng là <span class="correct-answer">${String.fromCharCode(65 + q.c)}</span>`;
document.getElementById("submitBtn").disabled = true;
document.getElementById("nextBtn").disabled = false;
} else {
fb.style.display = "none";
document.getElementById("submitBtn").disabled = false;
document.getElementById("nextBtn").disabled = true;
}
  if (currentIndex === questions.length - 1 && submitted[currentIndex]) {
    document.getElementById("nextBtn").innerText = "Xem kết quả";
  } else {
    document.getElementById("nextBtn").innerText = "Câu tiếp theo";
  }
  updateNavCircles();
}
document.getElementById("submitBtn").onclick = () => {
  if (selections[currentIndex] === null) return alert("Vui lòng chọn đáp án!");
  submitted[currentIndex] = true;
  if (selections[currentIndex] === questions[currentIndex].c) {
    score++;
    document.getElementById("correctSound").play();
  } else {
    document.getElementById("wrongSound").play();
  }
  renderQuestion();
};
document.getElementById("nextBtn").onclick = () => {
if (currentIndex < questions.length - 1) {
currentIndex++;
renderQuestion();
} else {
const rb = document.getElementById("resultBox");
rb.style.display = "block";
rb.innerHTML = `<h3>Hoàn thành!</h3><p style="font-size:20px;">Bạn đạt được <strong>${score} / ${questions.length}</strong> câu đúng (${((score/questions.length)*10).toFixed(2)} điểm).</p>`;
window.scrollTo(0, document.body.scrollHeight);
}
};
document.getElementById("resetBtn").onclick = () => { if(confirm("Làm mới toàn bộ câu hỏi?")) initQuiz(); };
initQuiz();
</script>
