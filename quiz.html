<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trắc nghiệm ôn thi</title>
<style>
:root {
  --bg1: #6d28d9; --bg2: #8b5cf6; --bg3: #a855f7;
  --purple: #7c3aed;
  --on-accent: #ffffff;
  --card: #ffffff;
  --panel: #ffffff;
  --text: #1d2433;
  --muted: #5d6b82;
  --border: #d8e0ee;
  --ok: #16844f;
  --bad: #c62828;
  --soft-bg: #ece4ff;
  --soft-text: #7c3aed;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg1: #171231; --bg2: #21184b; --bg3: #2c1f5f;
  --purple: #a78bfa;
  --on-accent: #241a4d;
  --card: #1e1a3c;
  --panel: #251f4d;
  --text: #e9e6fa;
  --muted: #a89fd0;
  --border: #3a3263;
  --ok: #4ade80;
  --bad: #f87171;
  --soft-bg: #2f2759;
  --soft-text: #c4b5fd;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #171231; --bg2: #21184b; --bg3: #2c1f5f;
    --purple: #a78bfa;
    --on-accent: #241a4d;
    --card: #1e1a3c;
    --panel: #251f4d;
    --text: #e9e6fa;
    --muted: #a89fd0;
    --border: #3a3263;
    --ok: #4ade80;
    --bad: #f87171;
    --soft-bg: #2f2759;
    --soft-text: #c4b5fd;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%); color: var(--text); min-height: 100vh; }
.hidden { display: none !important; }
.container { width: min(950px, 100%); margin: 0 auto; padding: 24px 16px; }
/* ---- Home ---- */
.home-head { text-align: center; color: #fff; margin-bottom: 24px; }
.home-head h1 { margin: 0; font-size: 28px; letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,0.2); }
.home-head .subtitle { margin-top: 6px; font-size: 14px; opacity: 0.9; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.5px; text-transform: uppercase; }
.section-title::before { content: ""; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #fff; }
.grid { display: grid; gap: 10px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; text-decoration: none; color: var(--text); display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.24); }
.card.badged { border-left: 6px solid var(--purple); }
.card.badged.cnxh { border-left-color: #f59e0b; }
.card .name { font-weight: 600; font-size: 15px; }
.card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.card .arrow { color: var(--muted); font-size: 20px; flex-shrink: 0; }
.foot { text-align: center; color: #fff; opacity: 0.85; font-size: 13px; margin-top: 28px; }
/* ---- Quiz screen ---- */
.qz-top { display: flex; align-items: center; gap: 14px; color: #fff; }
.back-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
.back-btn:hover { background: rgba(255,255,255,0.35); }
.qz-title { flex: 1; font-weight: 700; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.qz-counter { font-weight: 700; font-size: 15px; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 999px; }
.icon-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
.icon-btn:hover { background: rgba(255,255,255,0.35); }
.progress-bar { height: 8px; background: rgba(255,255,255,0.25); border-radius: 4px; margin: 14px 0 18px; overflow: hidden; }
#progress { height: 100%; background: #fff; width: 0%; border-radius: 4px; transition: width 0.3s; }
.qz-question-card { background: var(--card); border-radius: 16px; padding: 26px 24px; box-shadow: 0 10px 34px rgba(0,0,0,0.22); }
.qz-qnum { color: var(--purple); font-weight: 800; font-size: 13px; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
.qz-qtext { font-size: 20px; font-weight: 600; line-height: 1.5; white-space: pre-wrap; }
.qz-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 18px; }
.opt { border: none; border-radius: 16px; padding: 20px 18px; min-height: 120px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.18); transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s; text-align: left; }
.opt:hover:not(.disabled) { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.26); }
.opt.disabled { cursor: default; }
.opt.dim { opacity: 0.4; }
.opt-letter { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
.opt-text { font-size: 16px; font-weight: 600; line-height: 1.4; white-space: pre-wrap; }
.opt.correct { background: #16a34a !important; color: #fff !important; animation: pop 0.35s ease; }
.opt.wrong { background: #dc2626 !important; color: #fff !important; animation: shake 0.4s ease; }
@keyframes pop { 0% { transform: scale(0.92); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.qz-feedback { display: none; margin-top: 16px; background: var(--card); border-radius: 12px; padding: 14px 18px; font-weight: 600; font-size: 15px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
.qz-feedback.ok { color: var(--ok); }
.qz-feedback.bad { color: var(--bad); }
.countdown { margin-top: 6px; color: var(--muted); font-weight: 500; font-size: 13px; }
.repeat-list { margin-top: 18px; text-align: left; background: var(--soft-bg); border-radius: 12px; padding: 14px 16px; }
.repeat-title { font-weight: 800; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--soft-text); margin-bottom: 8px; }
.repeat-item { font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.repeat-item:last-child { border-bottom: none; }
.repeat-item b { color: var(--bad); }
/* ---- Result ---- */
#resultBox { max-width: 520px; margin: 40px auto; background: var(--card); border-radius: 20px; padding: 36px 28px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
#resultBox h2 { margin: 0 0 6px; font-size: 24px; }
#resultBox .score-line { font-size: 20px; font-weight: 700; margin: 12px 0; }
#resultBox .score-line b { color: var(--purple); }
#resultBox .pct { font-size: 15px; color: var(--muted); }
.result-actions { display: flex; gap: 10px; justify-content: center; margin-top: 24px; }
.result-actions button { padding: 12px 22px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
#restartBtn { background: var(--purple); color: var(--on-accent); }
#resultHomeBtn { background: var(--soft-bg); color: var(--soft-text); }
/* ---- Nav panel ---- */
.nav-panel { position: fixed; top: 12px; right: 12px; background: var(--panel); border-radius: 12px; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.28); display: flex; flex-wrap: wrap; gap: 6px; max-width: 200px; max-height: 320px; overflow-y: auto; z-index: 1000; }
.nav-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; border: 2px solid var(--border); background: var(--card); color: var(--text); transition: all 0.15s; user-select: none; }
.nav-circle:hover { transform: scale(1.15); }
.nav-circle.correct { background: #16a34a; border-color: #16a34a; color: #fff; }
.nav-circle.wrong { background: #dc2626; border-color: #dc2626; color: #fff; }
.nav-circle.current { outline: 3px solid var(--purple); }
.theme-toggle { position: fixed; bottom: 16px; right: 16px; width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--panel); color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,0.3); font-size: 20px; line-height: 1; cursor: pointer; z-index: 1001; transition: background 0.15s, transform 0.15s; }
.theme-toggle:hover { transform: scale(1.08); }
@media (max-width: 640px) {
  .qz-options { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .opt { padding: 14px 12px; min-height: 96px; }
  .opt-text { font-size: 14px; }
  .qz-qtext { font-size: 17px; }
}
</style>
</head>
<body>
<div class="container">
  <div id="homeScreen"></div>

  <div id="quizScreen" class="hidden">
    <div class="qz-top">
      <button class="back-btn" id="homeBtn" title="Danh sách đề">←</button>
      <div class="qz-title" id="quizTitle">CÂU HỎI TRẮC NGHIỆM</div>
      <div class="qz-counter" id="counter">1 / 20</div>
      <button class="icon-btn" id="resetBtn" title="Làm mới">⟳</button>
    </div>
    <div class="progress-bar"><div id="progress"></div></div>
    <div class="qz-question-card">
      <div class="qz-qnum" id="qIndexLabel">Câu 1</div>
      <div id="qText" class="qz-qtext"></div>
    </div>
    <div id="options" class="qz-options"></div>
    <div id="fb" class="qz-feedback">
      <span id="fbText"></span>
      <div id="countdown" class="countdown"></div>
    </div>
  </div>

  <div id="resultBox" class="hidden"></div>
</div>
<div id="navPanel" class="nav-panel"></div>
<button id="themeBtn" class="theme-toggle" title="Đổi giao diện sáng / tối">🌙</button>
<audio id="correctSound" src="dragon-studio-correct-472358.mp3"></audio>
<audio id="wrongSound" src="freesound_community-wrong-47985.mp3"></audio>
<script src="questions.js"></script>
<script>
let questions = [];
let order = [];
let pos = 0;
let displayIndex = -1;
let score = 0;
let done = [];
let attemptCounts = [];
let currentAnswered = false;
let pendingTimer = null;
let countdownTimer = null;
let activeKey = "";
const STATE_PREFIX = "quizState_";

const OPT_COLORS = ['#e8403e', '#2f6bff', '#d97706', '#23b573'];
const AUTO_ADVANCE_MS = 3000;

function subjectOf(key) { return key.indexOf('cnxh') === 0 ? 'cnxh' : 'tthcm'; }

const COMBINED_QUIZZES = {
  "cnxh-all": { title: "CNXH KH — Tổng hợp tất cả chương", keys: ["cnxkh1", "cnxkh2", "cnxkh3", "cnxkh4", "cnxkh5", "cnxkh6", "cnxkh7"] }
};

function resolveQuiz(key) {
  if (QUIZ_DATA[key]) return QUIZ_DATA[key];
  const comb = COMBINED_QUIZZES[key];
  if (!comb) return null;
  let questions = [];
  for (const k of comb.keys) {
    const qz = QUIZ_DATA[k];
    if (!qz) return null;
    questions = questions.concat(qz.questions.map(q => ({ q: q.q, a: q.a.slice(), c: q.c })));
  }
  return { title: comb.title, questions: questions };
}

function allQuizKeys() { return Object.keys(QUIZ_DATA).concat(Object.keys(COMBINED_QUIZZES)); }

function renderHome() {
  clearCountdown();
  document.getElementById("homeScreen").classList.remove("hidden");
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultBox").classList.add("hidden");
  document.getElementById("navPanel").innerHTML = "";
  const host = document.getElementById("homeScreen");
  host.innerHTML = `
    <div class="home-head">
      <h1>TRẮC NGHIỆM ÔN THI</h1>
      <p class="subtitle">Chọn một đề để bắt đầu làm bài</p>
    </div>
    <div class="section-title">Tư tưởng Hồ Chí Minh</div>
    <div class="grid" id="gridTthcm"></div>
    <div class="section-title">Chủ nghĩa xã hội khoa học</div>
    <div class="grid" id="gridCnxh"></div>
    <p class="foot">Tổng cộng 13 đề — 731 câu hỏi</p>`;
  let total = 0;
  for (const key of allQuizKeys()) {
    const quiz = resolveQuiz(key);
    total += quiz.questions.length;
    const div = document.createElement("div");
    div.className = "card badged" + (subjectOf(key) === 'cnxh' ? ' cnxh' : '');
    div.innerHTML = `<div><div class="name">${quiz.title}</div><div class="meta">${quiz.questions.length} câu</div></div><span class="arrow">›</span>`;
    div.onclick = () => openQuiz(key);
    document.getElementById(subjectOf(key) === 'cnxh' ? "gridCnxh" : "gridTthcm").appendChild(div);
  }
  const totals = host.querySelector(".foot");
  totals.textContent = "Tổng cộng " + allQuizKeys().length + " đề — " + total + " câu hỏi";
}

function loadQuizState(key) {
  try {
    const raw = localStorage.getItem(STATE_PREFIX + key);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.questions) || !Array.isArray(s.order) || !Array.isArray(s.done)) return null;
    return s;
  } catch (e) { return null; }
}
function saveQuizState(key) {
  try {
    localStorage.setItem(STATE_PREFIX + key, JSON.stringify({
      questions: questions, order: order, pos: pos, score: score,
      done: done, attemptCounts: attemptCounts, savedAt: Date.now()
    }));
  } catch (e) {}
}
function clearQuizState(key) {
  try { localStorage.removeItem(STATE_PREFIX + key); } catch (e) {}
}

function openQuiz(key) {
  const quiz = resolveQuiz(key);
  if (!quiz) return renderHome();
  activeKey = key;
  questions = quiz.questions;
  document.title = quiz.title + " — Trắc nghiệm";
  document.getElementById("quizTitle").textContent = quiz.title;
  document.getElementById("homeScreen").classList.add("hidden");
  document.getElementById("resultBox").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  history.replaceState(null, "", "quiz.html?q=" + key);
  const saved = loadQuizState(key);
  if (saved && saved.questions.length === quiz.questions.length) {
    questions = saved.questions;
    order = saved.order;
    pos = saved.pos;
    score = saved.score;
    done = saved.done;
    attemptCounts = saved.attemptCounts;
    displayIndex = -1;
    currentAnswered = false;
    buildNavCircles();
    renderQuestion();
  } else {
    initQuiz();
  }
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function shuffleQuestions() {
  for (const q of questions) {
    const idx = Array.from({ length: q.a.length }, (_, i) => i);
    shuffleArray(idx);
    const oldC = q.c;
    q.a = idx.map(i => q.a[i]);
    q.c = idx.indexOf(oldC);
  }
  shuffleArray(questions);
}
function initQuiz() {
  clearQuizState(activeKey);
  shuffleQuestions();
  pos = 0; score = 0;
  order = questions.map((_, i) => i);
  done = Array(questions.length).fill(false);
  attemptCounts = Array(questions.length).fill(0);
  buildNavCircles();
  renderQuestion();
}
function buildNavCircles() {
  const panel = document.getElementById("navPanel");
  panel.innerHTML = "";
  for (let i = 0; i < questions.length; i++) {
    const c = document.createElement("div");
    c.className = "nav-circle unanswered";
    c.textContent = i + 1;
    c.dataset.index = i;
    c.onclick = () => {
      clearCountdown();
      if (done[+c.dataset.index]) return;
      const idx = order.lastIndexOf(+c.dataset.index);
      if (idx !== -1) { pos = idx; renderQuestion(); }
    };
    panel.appendChild(c);
  }
}
function updateNavCircles() {
  const circles = document.querySelectorAll(".nav-circle");
  circles.forEach((c, i) => {
    c.classList.remove("correct", "wrong", "unanswered", "current");
    if (done[i]) {
      c.classList.add("correct");
    } else if (attemptCounts[i] > 1) {
      c.classList.add("wrong");
    } else {
      c.classList.add("unanswered");
    }
    if (i === displayIndex) c.classList.add("current");
    let title = `Câu ${i + 1}`;
    if (attemptCounts[i] > 1) {
      title += ` — xuất hiện ${attemptCounts[i]} lần`;
      const back = turnsUntilQIndex(i);
      if (back !== null) title += ` — quay lại sau ${back} câu`;
    }
    c.title = title;
  });
}

function turnsUntilQIndex(qIndex) {
  const idx = order.lastIndexOf(qIndex);
  if (idx === -1 || idx <= pos) return null;
  let count = 0;
  for (let k = pos + 1; k <= idx; k++) {
    if (!done[order[k]]) count++;
  }
  return count;
}

function clearCountdown() {
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
}

function startCountdown(ms) {
  clearCountdown();
  const cdBox = document.getElementById("countdown");
  let remaining = Math.ceil(ms / 1000);
  cdBox.textContent = "Tự chuyển câu tiếp theo sau " + remaining + " giây";
  countdownTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0) { clearInterval(countdownTimer); countdownTimer = null; }
    else cdBox.textContent = "Tự chuyển câu tiếp theo sau " + remaining + " giây";
  }, 1000);
  pendingTimer = setTimeout(advance, ms);
}

function advance() {
  pendingTimer = null;
  pos++;
  renderQuestion();
}

function renderQuestion() {
  clearCountdown();
  while (pos < order.length && done[order[pos]]) pos++;
  if (pos >= order.length) { showResult(); return; }
  const qIndex = order[pos];
  displayIndex = qIndex;
  const q = questions[qIndex];
  attemptCounts[qIndex]++;
  currentAnswered = false;
  document.getElementById("counter").textContent = `Đúng ${score} / ${questions.length}`;
  document.getElementById("qIndexLabel").textContent = `Câu ${qIndex + 1}` + (attemptCounts[qIndex] > 1 ? ` · Xuất hiện lần ${attemptCounts[qIndex]}` : "");
  document.getElementById("progress").style.width = `${(score / questions.length) * 100}%`;
  document.getElementById("qText").textContent = q.q;
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  q.a.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "opt";
    const colorIdx = i % OPT_COLORS.length;
    div.style.background = OPT_COLORS[colorIdx];
    div.style.color = "#fff";
    div.innerHTML = `<div class="opt-letter"></div><div class="opt-text"></div>`;
    div.querySelector(".opt-letter").textContent = String.fromCharCode(65 + i);
    div.querySelector(".opt-letter").style.background = "rgba(255,255,255,0.24)";
    div.querySelector(".opt-text").textContent = opt;
    div.onclick = () => { if (!currentAnswered) submitAnswer(i); };
    optionsDiv.appendChild(div);
  });
  const fb = document.getElementById("fb");
  fb.style.display = "none";
  document.getElementById("fbText").textContent = "";
  document.getElementById("countdown").textContent = "";
  updateNavCircles();
}

function submitAnswer(i) {
  if (currentAnswered) return;
  currentAnswered = true;
  const qIndex = order[pos];
  const q = questions[qIndex];
  const ok = i === q.c;
  const optionsDiv = document.getElementById("options");
  Array.from(optionsDiv.children).forEach((div, idx) => {
    div.classList.add("disabled");
    if (idx === q.c) div.classList.add("correct");
    else if (idx === i) div.classList.add("wrong");
    else div.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  fb.style.display = "block";
  if (ok) {
    score++;
    done[qIndex] = true;
    fb.className = "qz-feedback ok";
    document.getElementById("fbText").textContent = "Chính xác!";
    try { document.getElementById("correctSound").play(); } catch (e) {}
  } else {
    fb.className = "qz-feedback bad";
    document.getElementById("fbText").textContent = `Sai rồi — Đáp án đúng: ${String.fromCharCode(65 + q.c)}`;
    try { document.getElementById("wrongSound").play(); } catch (e) {}
    const total = questions.length;
    const gap = Math.round(total * 0.3) + Math.floor(Math.random() * Math.round(total * 0.7));
    order.splice(Math.min(pos + gap, order.length), 0, qIndex);
    const back = turnsUntilQIndex(qIndex);
    document.getElementById("fbText").textContent = `Sai rồi — Đáp án đúng: ${String.fromCharCode(65 + q.c)}. Sẽ quay lại sau ${back} câu nữa.`;
  }
  updateNavCircles();
  saveQuizState(activeKey);
  startCountdown(AUTO_ADVANCE_MS);
}

function showResult() {
  clearCountdown();
  clearQuizState(activeKey);
  document.getElementById("quizScreen").classList.add("hidden");
  const rb = document.getElementById("resultBox");
  rb.classList.remove("hidden");
  const totalAttempts = attemptCounts.reduce((a, b) => a + b, 0);
  const totalWrong = totalAttempts - questions.length;
  const repeated = questions.map((q, i) => ({ n: i + 1, tries: attemptCounts[i] })).filter(r => r.tries > 1);
  const emoji = totalWrong === 0 ? "🏆" : totalWrong <= 3 ? "🎉" : totalWrong <= 8 ? "👍" : "💪";
  let breakdown = "";
  if (repeated.length) {
    breakdown = `
    <div class="repeat-list">
      <div class="repeat-title">Câu trả lời sai được nhắc lại — ${repeated.length} câu</div>
      ${repeated.map(r => `<div class="repeat-item">Câu <b>${r.n}</b>: xuất hiện <b>${r.tries}</b> lần — sai <b>${r.tries - 1}</b> lần</div>`).join("")}
    </div>`;
  }
  rb.innerHTML = `
    <div style="font-size:52px;">${emoji}</div>
    <h2>Hoàn thành!</h2>
    <div class="score-line">Đúng <b>${score} / ${questions.length}</b> câu</div>
    <div class="pct">Số lượt trả lời: <b>${totalAttempts}</b> · Số lần sai: <b>${totalWrong}</b></div>
    ${breakdown}
    <div class="result-actions">
      <button id="restartBtn">Làm lại</button>
      <button id="resultHomeBtn">Danh sách đề</button>
    </div>`;
  document.getElementById("restartBtn").onclick = () => { rb.classList.add("hidden"); document.getElementById("quizScreen").classList.remove("hidden"); initQuiz(); };
  document.getElementById("resultHomeBtn").onclick = () => renderHome();
  document.getElementById("navPanel").innerHTML = "";
  window.scrollTo(0, 0);
}

document.getElementById("resetBtn").onclick = () => { if (confirm("Làm mới toàn bộ câu hỏi?")) initQuiz(); };
document.getElementById("homeBtn").onclick = () => { renderHome(); history.replaceState(null, "", "quiz.html"); window.scrollTo(0, 0); };

// ---- Theme (sáng / tối) ----
function getSystemTheme() {
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function savedTheme() {
  try { return localStorage.getItem('theme'); } catch (e) { return null; }
}
function actualTheme() {
  const saved = savedTheme();
  if (saved === 'dark') return 'dark';
  if (saved === 'light') return 'light';
  return getSystemTheme();
}
function applyTheme() {
  const saved = savedTheme();
  const root = document.documentElement;
  if (saved === 'dark') root.setAttribute('data-theme', 'dark');
  else if (saved === 'light') root.setAttribute('data-theme', 'light');
  else root.removeAttribute('data-theme');
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = actualTheme() === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').onclick = () => {
  try { localStorage.setItem('theme', actualTheme() === 'dark' ? 'light' : 'dark'); } catch (e) {}
  applyTheme();
};
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
}
applyTheme();

const param = new URLSearchParams(location.search).get("q");
if (param && resolveQuiz(param)) {
  openQuiz(param);
} else {
  renderHome();
}
</script>
</body>
</html>
