<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz Tư tưởng Hồ Chí Minh</title>
<style>
:root { --bg: #f4f7fb; --card: #ffffff; --text: #1d2433; --muted: #5d6b82; --primary: #1b6ef3; --primary-dark: #0f4fb5; --ok: #16844f; --border: #dce4f3; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(145deg, #ecf3ff 0%, #f8fbff 50%, #eefbf6 100%); color: var(--text); min-height: 100vh; padding: 24px; }
.container { width: min(950px, 100%); margin: 0 auto; }
.header { margin-bottom: 16px; text-align: center; }
h1 { margin: 0; font-size: 24px; color: var(--primary-dark); }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
#progress { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
.card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
.question-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
.options { display: grid; gap: 12px; }
.option { display: flex; align-items: center; padding: 14px 16px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; position: relative; }
.option:hover:not(.disabled) { border-color: var(--primary); background: #f0f6ff; }
.option.selected { border-color: var(--primary); background: #f0f6ff; font-weight: 600; }
.option.correct { border-color: var(--ok); background: #e8f5e9; color: var(--ok); }
.option.wrong { border-color: #d32f2f; background: #ffebee; color: #d32f2f; }
.option input { display: none; }
.controls { margin-top: 24px; display: flex; justify-content: space-between; gap: 12px; }
button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 15px; }
#submitBtn { background: var(--primary); color: white; }
#nextBtn { background: var(--text); color: white; }
#resetBtn { background: #e0e0e0; color: #444; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.feedback { margin-top: 16px; padding: 12px; border-radius: 6px; font-weight: 500; display: none; }
.correct-answer { font-weight: bold; color: var(--ok); }
#resultBox { display: none; margin-top: 24px; text-align: center; padding: 30px; border-radius: 12px; background: white; }
.nav-panel {
  position: fixed; top: 12px; right: 12px;
  background: white; border-radius: 10px; padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  border: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 6px;
  max-width: 200px; max-height: 300px; overflow-y: auto;
  z-index: 1000;
}
.nav-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; border: 2px solid var(--border); background: white; color: var(--text); transition: all 0.15s; user-select: none; }
.nav-circle:hover { transform: scale(1.15); }
.nav-circle.correct { background: #16844f; border-color: #16844f; color: white; }
.nav-circle.wrong { background: #d32f2f; border-color: #d32f2f; color: white; }
.nav-circle.current.correct { background: #0e5c36; border-color: #0e5c36; }
.nav-circle.current.wrong { background: #a12121; border-color: #a12121; }
.nav-circle.current.unanswered { background: #d0d8e8; border-color: #b0bcd4; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>CÂU HỎI TRẮC NGHIỆM<br>TƯ TƯỞNG HỒ CHÍ MINH</h1>
<p id="counter">Câu 1 / 36</p>
</div>
<div class="progress-bar"><div id="progress"></div></div>
<div class="card">
<div id="qText" class="question-text"></div>
<div id="options" class="options"></div>
<div id="fb" class="feedback"></div>
<div class="controls">
<button id="resetBtn">Làm mới</button>
<div style="display:flex; gap:12px;">
<button id="submitBtn">Gửi đáp án</button>
<button id="nextBtn" disabled>Câu tiếp theo</button>
</div>
</div>
</div>
<div id="resultBox" class="card"></div>
</div>
<div id="navPanel" class="nav-panel"></div>
<script>
const questions = [
{ q: "Nhân tố chủ quan Hồ Chí Minh bao gồm những nội dung gì?", a: ["Phẩm chất Hồ Chí Minh và tài năng hoạt động, tổng kết thực tiễn phát triển lý luận.", "Phẩm chất Hồ Chí Minh và khả năng tổng kết thực tiễn.", "Tài năng hoạt động, tổng kết thực tiễn phát triển lý luận.", "Phẩm chất Hồ Chí Minh."], c: 0 },
{ q: "Đâu không phải là cơ sở lý luận hình thành tư tưởng Hồ Chí Minh?", a: ["Tinh hoa văn hoá nhân loại.", "Tài năng hoạt động, tổng kết thực tiễn phát triển lý luận của Hồ Chí Minh.", "Chủ nghĩa Mác - Lênin.", "Giá trị truyền thống tốt đẹp của dân tộc Việt Nam."], c: 1 },
{ q: "Trong thời kì 1911 - 1920, Hồ Chí Minh đã hình thành tư tưởng cứu nước, giải phóng dân tộc theo con đường cách mạng nào?", a: ["Cách mạng xã hội chủ nghĩa.", "Cách mạng tư sản.", "Cách mạng vô sản.", "Cách mạng vô sản và cách mạng xã hội chủ nghĩa."], c: 2 },
{ q: "Theo Hồ Chí Minh, ưu điểm lớn nhất của chủ nghĩa Mác là gì?", a: ["Bản chất khoa học.", "Bản chất cách mạng.", "Phương pháp làm việc biện chứng.", "Chủ nghĩa nhân đạo triệt để."], c: 2 },
{ q: "Hồ Chí Minh về nước trực tiếp lãnh đạo phong trào cách mạng khi nào?", a: ["Ngày 28/02/1941.", "Ngày 30/01/1941.", "Ngày 28/01/1941.", "Ngày 28/01/1942."], c: 2 },
{ q: "Tìm một điểm nhầm lẫn trong đoạn viết sau: Một trong những nguồn gốc của tư tưởng Hồ Chí Minh là tiếp thu văn hóa phương Đông. Cụ thể là:", a: ["Những mặt tích cực của Nho giáo.", "Kế thừa các giá trị văn hóa tiến bộ của thời kỳ Phục Hưng.", "Tư tưởng vị tha của Phật giáo.", "Kế thừa tư tưởng Tam dân của Tôn Dật Tiên."], c: 1 },
{ q: "Điền vào chỗ trống cụm từ còn thiếu: \"Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa chân chính nhất, chắc chắn nhất, cách mệnh nhất là ...\" (Hồ Chí Minh: Toàn tập, Nxb. Chính trị Quốc gia - Sự thật, Hà Nội, 2011, t.2, tr.289).", a: ["Chủ nghĩa Mác - Lênin.", "Chủ nghĩa Lênin.", "Chủ nghĩa Mác.", "Chủ nghĩa Mác - Ăngghen."], c: 1 },
{ q: "\"Toàn Đảng toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hoà bình, thống nhất, độc lập, dân chủ và giàu mạnh, và góp phần xứng đáng vào sự nghiệp cách mạng thế giới\" (Hồ Chí Minh: Toàn tập, Nxb. Chính trị Quốc gia - Sự thật, Hà Nội, 2011, t.15, tr.614). Nhận định trên của Hồ Chí Minh được thể hiện trong tác phẩm/văn kiện nào?", a: ["Tuyên ngôn độc lập.", "Lời kêu gọi toàn quốc kháng chiến.", "Di chúc.", "Cương lĩnh chính trị đầu tiên."], c: 2 },
{ q: "Tư tưởng Hồ Chí Minh có giá trị như thế nào đối với cách mạng thế giới?", a: ["Tư tưởng Hồ Chí Minh góp phần tích cực vào cuộc đấu tranh vì độc lập dân tộc, dân chủ, hòa bình, hợp tác và quyết định sự phát triển của thế giới trong thế kỷ XXI.", "Tư tưởng Hồ Chí Minh góp phần mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc gắn với sự tiến bộ xã hội và góp phần tích cực vào cuộc đấu tranh vì độc lập dân tộc, dân chủ, hòa bình, hợp tác và phát triển trên thế giới.", "Tư tưởng Hồ Chí Minh góp phần mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc gắn với sự tiến bộ xã hội và góp phần cải tạo và xây dựng thành công chủ nghĩa xã hội ở Việt Nam.", "Tư tưởng Hồ Chí Minh góp phần mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc gắn với sự tiến bộ xã hội và là yếu tố quyết định để tất cả các dân tộc trên thế giới giải phóng triệt để dân tộc, giải phóng triệt để giai cấp và giải phóng triệt để con người."], c: 1 },
{ q: "Tư tưởng Hồ Chí Minh không kế thừa và phát triển những tinh hoa văn hóa phương Đông nào?", a: ["Phật giáo.", "Lão giáo.", "Nho giáo.", "Thiên chúa giáo."], c: 3 },
{ q: "Trong các cơ sở hình thành tư tưởng Hồ Chí Minh, cơ sở nào là nhân tố quyết định những thành công trong hoạt động lý luận và thực tiễn của Hồ Chí Minh cho dân tộc Việt Nam và nhân loại?", a: ["Cơ sở lý luận.", "Chủ nghĩa Mác - Lênin.", "Cơ sở thực tiễn.", "Những phẩm chất cá nhân."], c: 1 },
{ q: "Đối với cách mạng Việt Nam, tư tưởng Hồ Chí Minh có giá trị như thế nào?", a: ["Tư tưởng Hồ Chí Minh đưa cách mạng giải phóng dân tộc Việt Nam đến thắng lợi và bắt đầu xây dựng một xã hội mới trên đất nước ta; Tư tưởng Hồ Chí Minh là nhân tố duy nhất quyết định mọi thắng lợi của cách mạng Việt Nam.", "Góp phần mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc gắn với sự tiến bộ xã hội.", "Tư tưởng Hồ Chí Minh đưa cách mạng giải phóng dân tộc Việt Nam đến thắng lợi và bắt đầu xây dựng một xã hội mới trên đất nước ta; Tư tưởng Hồ Chí Minh là nền tảng tư tưởng và kim chỉ nam cho cách mạng Việt Nam.", "Tư tưởng Hồ Chí Minh góp phần tích cực vào cuộc đấu tranh vì độc lập dân tộc, dân chủ, hòa bình, hợp tác và phát triển trên thế giới."], c: 2 },
{ q: "Chọn cụm từ đúng để điền vào dấu ... trong câu sau: Tháng 7 năm 1920, Hồ Chí Minh đọc ... của V.I.Lênin.", a: ["Tác phẩm \"Làm gì\".", "Sơ thảo lần thứ nhất Luận cương về các vấn đề dân tộc.", "Sơ thảo lần thứ nhất những Luận cương về các vấn đề dân tộc và vấn đề thuộc địa.", "Tất cả các phương án còn lại đều là sai."], c: 2 },
{ q: "Trước lúc đi xa, Hồ Chí Minh để lại cho dân tộc Việt Nam văn kiện lịch sử vô giá nào?", a: ["Kháng chiến kiến quốc.", "Di chúc.", "Nhật ký trong tù.", "Lời kêu gọi toàn quốc kháng chiến."], c: 1 },
{ q: "Những nội dung cơ bản của tư tưởng Hồ Chí Minh về cách mạng Việt Nam được hình thành ở thời kỳ nào?", a: ["Thời kỳ 1911 - 1920.", "Thời kỳ 1930 - 1941.", "Thời kỳ trước năm 1911.", "Thời kỳ 1920 - 1930"], c: 3 },
{ q: "Trong thời kì 1911 - 1920, việc hình thành tư tưởng cứu nước, giải phóng dân tộc Việt Nam theo con đường cách mạng vô sản của Hồ Chí Minh không được thể hiện qua hoạt động nào?", a: ["Hồ Chí Minh có bước nhận thức mới về quyền tự do, dân chủ của nhân dân.", "Hồ Chí Minh xác định đúng bản chất, thủ đoạn, tội ác của chủ nghĩa thực dân và tình cảnh nhân dân các nước thuộc địa.", "Hồ Chí Minh đã tìm thấy và xác định rõ phương hướng đấu tranh giải phóng dân tộc Việt Nam theo con đường cách mạng vô sản.", "Hồ Chí Minh đã chủ trì Hội nghị hợp nhất các tổ chức cộng sản Việt Nam thành Đảng Cộng sản Việt Nam."], c: 3 },
{ q: "Hồ Chí Minh thay mặt những người Việt Nam yêu nước ở Pháp, lấy tên Nguyễn Ái Quốc, gửi tới Hội nghị Vécxây (18/6/1919) văn bản gì?", a: ["Bản án chế độ thực dân Pháp.", "Vấn đề dân bản xứ.", "Yêu sách của nhân dân An Nam.", "Đường cách mệnh."], c: 2 },
{ q: "Theo Hồ Chí Minh, ưu điểm lớn nhất của học thuyết Khổng Tử là gì?", a: ["Quản lý xã hội bằng đạo đức.", "Sự tu dưỡng đạo đức cá nhân.", "Đạo chính danh.", "Tinh thần hiếu học."], c: 1 },
{ q: "Hồ Chí Minh vĩnh biệt chúng ta vào giờ và ngày tháng năm nào?", a: ["9 giờ 47 phút ngày 3/9/1969.", "9 giờ 47 phút ngày 1/9/1969.", "9 giờ 47 phút ngày 2/9/1969.", "9 giờ 45 phút ngày 2/9/1969."], c: 2 },
{ q: "Thực tiễn Việt Nam cuối thế kỷ XIX - đầu thế kỷ XX đã có phong trào yêu nước nào không tác động đến sự hình thành tư tưởng Hồ Chí Minh?", a: ["Phong trào yêu nước theo khuynh hướng dân chủ tư sản.", "Phong trào yêu nước theo hệ tư tưởng phong kiến.", "Phong trào đấu tranh của giai cấp công nhân.", "Phong trào yêu nước theo hệ tư tưởng dân chủ."], c: 2 },
{ q: "Nguyễn Tất Thành vào Đảng Xã hội Pháp năm nào?", a: ["Đầu năm 1918.", "Đầu năm 1921.", "Đầu năm 1920.", "Đầu năm 1919."], c: 3 },
{ q: "Trong giai đoạn nào, Hồ Chí Minh là linh hồn của cuộc kháng chiến chống thực dân Pháp.", a: ["Từ năm 1941 đến năm 1946", "Từ năm 1954 đến năm 1969.", "Từ năm 1945 đến năm 1945.", "Từ năm 1946 đến năm 1954."], c: 3 },
{ q: "Hồ Chí Minh thành lập Hội Việt Nam cách mạng thanh niên vào năm nào?", a: ["Năm 1927.", "Năm 1925.", "Năm 1930.", "Năm 1920."], c: 1 },
{ q: "Trong các cơ sở lý luận hình thành tư tưởng Hồ Chí Minh, đâu là tiền đề lý luận quan trọng nhất, có vai trò quyết định trong việc hình thành tư tưởng Hồ Chí Minh?", a: ["Nhân tố chủ quan Hồ Chí Minh.", "Tinh hoa văn hoá nhân loại.", "Chủ nghĩa Mác - Lênin.", "Giá trị truyền thống tốt đẹp của dân tộc Việt Nam."], c: 2 },
{ q: "Truyền thống quý báu nhất của dân tộc Việt Nam được Hồ Chí Minh kế thừa và phát triển là gì?", a: ["Chủ nghĩa yêu nước.", "Cần cù lao động.", "Tinh thần hiếu học.", "Lòng nhân ái."], c: 0 },
{ q: "Hồ Chí Minh đến với chủ nghĩa Mác - Lênin và trở thành người cộng sản đầu tiên của Việt Nam vào thời gian nào?", a: ["Năm 1919.", "Năm 1925.", "Năm 1930.", "Năm 1920."], c: 3 },
{ q: "Trong các giá trị truyền thống tốt đẹp của dân tộc Việt Nam, giá trị nào là nền tảng tư tưởng, điểm xuất phát và động lực thúc đẩy Hồ Chí Minh ra đi tìm đường cứu nước, và tìm thấy ở chủ nghĩa Mác - Lênin con đường cứu nước, cứu dân?", a: ["Tinh thần cần cù, dũng cảm.", "Tinh thần nhân ái.", "Tinh thần đoàn kết.", "Chủ nghĩa yêu nước."], c: 3 },
{ q: "Ai là người đã có công lớn trong việc cứu Hồ Chí Minh ra khỏi nhà tù của thực dân Anh ở Hồng Kông?", a: ["Luật sư Nôoen Pri.", "Tômát Xautôn (phó Thống đốc Hồng Kông).", "Tất cả các phương án còn lại đều là sai.", "Luật sư Lôdơby."], c: 3 },
{ q: "Hồ Chí Minh đã từng dạy học ở ngôi trường nào?", a: ["Trường Quốc học Huế.", "Trường tiểu học Pháp - Việt ở Vinh.", "Trường tiểu học Đông Ba ở Huế.", "Trường Dục Thanh ở Phan Thiết."], c: 3 },
{ q: "Lần đầu tiên Nguyễn Tất Thành đặt chân lên đất Pháp tại bến cảng nào?", a: ["Mácxây.", "Đoong kéc.", "Boócđô.", "Lơ Havrơ."], c: 0 },
{ q: "Tại Đại hội lần thứ XVIII của Đảng Xã hội Pháp (12/1920) ở thành phố Tua, Hồ Chí Minh đã:", a: ["Bỏ phiếu tán thành Quốc tế Cộng sản.", "Tuyên truyền chủ nghĩa Mác - Lênin.", "Bỏ phiếu tán thành Quốc tế Cộng sản, tham gia sáng lập Đảng Cộng sản Pháp, trở thành người cộng sản Việt Nam đầu tiên.", "Tham gia sáng lập Đảng Cộng sản Pháp."], c: 2 },
{ q: "Tác phẩm Đường cách mệnh của Hồ Chí Minh được xuất bản vào năm nào?", a: ["Năm 1925.", "Năm 1927.", "Năm 1930.", "Năm 1920."], c: 1 },
{ q: "Từ năm 1954 đến năm 1969, Hồ Chí Minh cùng với Đảng đã:", a: ["Xác định và lãnh đạo thực hiện đường lối tiến hành đồng thời hai nhiệm vụ chiến lược của cách mạng Việt Nam là: Xây dựng chủ nghĩa xã hội ở miền Bắc; tiếp tục cuộc cách mạng dân tộc dân chủ nhân dân ở miền Nam để thống nhất nước nhà.", "Đề ra chiến lược, sách lược sáng suốt, lãnh đạo chính quyền cách mạng non trẻ vượt qua tình thế \"ngàn cân treo sợi tóc\".", "Đề ra đường lối kháng chiến toàn dân, toàn diện, lâu dài, tự lực cánh sinh.", "Đề ra chủ trương Tổng khởi nghĩa giành chính quyền, đưa đến thắng lợi Cách mạng Tháng Tám năm 1945."], c: 0 },

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function shuffleQuestions() {
  for (const q of questions) {
    const idx = Array.from({ length: q.a.length }, (_, i) => i);
    shuffleArray(idx);
    const oldC = q.c;
    q.a = idx.map(i => q.a[i]);
    q.c = idx.indexOf(oldC);
  }
  shuffleArray(questions);
}
let currentIndex = 0;
let score = 0;
let selections = Array(questions.length).fill(null);
let submitted = Array(questions.length).fill(false);
function initQuiz() {
shuffleQuestions();
currentIndex = 0; score = 0;
selections = Array(questions.length).fill(null);
submitted = Array(questions.length).fill(false);
buildNavCircles();
renderQuestion();
document.getElementById("resultBox").style.display = "none";
}
function buildNavCircles() {
  const panel = document.getElementById("navPanel");
  panel.innerHTML = "";
  for (let i = 0; i < questions.length; i++) {
    const c = document.createElement("div");
    c.className = "nav-circle unanswered";
    c.textContent = i + 1;
    c.dataset.index = i;
    c.onclick = () => { currentIndex = +c.dataset.index; renderQuestion(); };
    panel.appendChild(c);
  }
}
function updateNavCircles() {
  const circles = document.querySelectorAll(".nav-circle");
  circles.forEach((c, i) => {
    c.classList.remove("correct", "wrong", "unanswered", "current");
    if (submitted[i]) {
      c.classList.add(selections[i] === questions[i].c ? "correct" : "wrong");
    } else {
      c.classList.add("unanswered");
    }
    if (i === currentIndex) c.classList.add("current");
  });
}
function renderQuestion() {
const q = questions[currentIndex];
document.getElementById("counter").innerText = `Câu ${currentIndex + 1} / ${questions.length}`;
document.getElementById("progress").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
document.getElementById("qText").innerText = q.q;
const optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";
q.a.forEach((opt, i) => {
const div = document.createElement("div");
div.className = "option";
if (selections[currentIndex] === i) div.classList.add("selected");
if (submitted[currentIndex]) {
div.classList.add("disabled");
if (i === q.c) div.classList.add("correct");
if (selections[currentIndex] === i && i !== q.c) div.classList.add("wrong");
}
div.innerHTML = `<input type="radio" name="q" value="${i}" ${selections[currentIndex] === i ? 'checked' : ''}> <span>${String.fromCharCode(65 + i)}. ${opt}</span>`;
div.onclick = () => { if (!submitted[currentIndex]) { selections[currentIndex] = i; renderQuestion(); } };
optionsDiv.appendChild(div);
});
const fb = document.getElementById("fb");
if (submitted[currentIndex]) {
fb.style.display = "block";
fb.style.background = selections[currentIndex] === q.c ? "#e8f5e9" : "#ffebee";
fb.innerHTML = selections[currentIndex] === q.c ? "✅ Chính xác!" : `❌ Sai rồi! Đáp án đúng là <span class="correct-answer">${String.fromCharCode(65 + q.c)}</span>`;
document.getElementById("submitBtn").disabled = true;
document.getElementById("nextBtn").disabled = false;
} else {
fb.style.display = "none";
document.getElementById("submitBtn").disabled = false;
document.getElementById("nextBtn").disabled = true;
}
  if (currentIndex === questions.length - 1 && submitted[currentIndex]) {
    document.getElementById("nextBtn").innerText = "Xem kết quả";
  } else {
    document.getElementById("nextBtn").innerText = "Câu tiếp theo";
  }
  updateNavCircles();
}
document.getElementById("submitBtn").onclick = () => {
  if (selections[currentIndex] === null) return alert("Vui lòng chọn đáp án!");
  submitted[currentIndex] = true;
  if (selections[currentIndex] === questions[currentIndex].c) {
    score++;
    document.getElementById("correctSound").play();
  } else {
    document.getElementById("wrongSound").play();
  }
  renderQuestion();
};
document.getElementById("nextBtn").onclick = () => {
if (currentIndex < questions.length - 1) {
currentIndex++;
renderQuestion();
} else {
const rb = document.getElementById("resultBox");
rb.style.display = "block";
rb.innerHTML = `<h3>Hoàn thành!</h3><p style="font-size:20px;">Bạn đạt được <strong>${score} / ${questions.length}</strong> câu đúng (${((score/questions.length)*10).toFixed(2)} điểm).</p>`;
window.scrollTo(0, document.body.scrollHeight);
}
};
document.getElementById("resetBtn").onclick = () => { if(confirm("Làm mới toàn bộ câu hỏi?")) initQuiz(); };
initQuiz();
</script>
