<style>
:root { --bg: #f4f7fb; --card: #ffffff; --text: #1d2433; --muted: #5d6b82; --primary: #1b6ef3; --primary-dark: #0f4fb5; --ok: #16844f; --border: #dce4f3; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(145deg, #ecf3ff 0%, #f8fbff 50%, #eefbf6 100%); color: var(--text); min-height: 100vh; padding: 24px; }
.container { width: min(950px, 100%); margin: 0 auto; }
.header { margin-bottom: 16px; text-align: center; }
h1 { margin: 0; font-size: 24px; color: var(--primary-dark); }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
#progress { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
.card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
.question-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
.options { display: grid; gap: 12px; }
.option { display: flex; align-items: center; padding: 14px 16px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; position: relative; }
.option:hover:not(.disabled) { border-color: var(--primary); background: #f0f6ff; }
.option.selected { border-color: var(--primary); background: #f0f6ff; font-weight: 600; }
.option.correct { border-color: var(--ok); background: #e8f5e9; color: var(--ok); }
.option.wrong { border-color: #d32f2f; background: #ffebee; color: #d32f2f; }
.option input { display: none; }
.controls { margin-top: 24px; display: flex; justify-content: space-between; gap: 12px; }
button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 15px; }
#submitBtn { background: var(--primary); color: white; }
#nextBtn { background: var(--text); color: white; }
#resetBtn { background: #e0e0e0; color: #444; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.feedback { margin-top: 16px; padding: 12px; border-radius: 6px; font-weight: 500; display: none; }
.correct-answer { font-weight: bold; color: var(--ok); }
#resultBox { display: none; margin-top: 24px; text-align: center; padding: 30px; border-radius: 12px; background: white; }
.nav-panel {
  position: fixed; top: 12px; right: 12px;
  background: white; border-radius: 10px; padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  border: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 6px;
  max-width: 200px; max-height: 300px; overflow-y: auto;
  z-index: 1000;
}
.nav-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; border: 2px solid var(--border); background: white; color: var(--text); transition: all 0.15s; user-select: none; }
.nav-circle:hover { transform: scale(1.15); }
.nav-circle.correct { background: #16844f; border-color: #16844f; color: white; }
.nav-circle.wrong { background: #d32f2f; border-color: #d32f2f; color: white; }
.nav-circle.current.correct { background: #0e5c36; border-color: #0e5c36; }
.nav-circle.current.wrong { background: #a12121; border-color: #a12121; }
.nav-circle.current.unanswered { background: #d0d8e8; border-color: #b0bcd4; }

<script>
const questions = [
{ q: 'Những cộng đồng người cùng toàn bộ những mối quan hệ xã hội do sự tác động lẫn nhau của các cộng đồng ấy tạo nên là nội dung thể hiện khái niệm nào dưới đây?', a: ['Dân tộc.', 'Dân cư.', 'Cơ cấu xã hội.', 'Cộng đồng.'], c: 2 },
{ q: 'Tập hợp những cộng đồng người hình thành, phát triển theo các nghề nghiệp khác nhau là kết quả của sự phát triển sản xuất, phân công lao động là nội dung thể hiện khái niệm nào dưới đây?', a: ['Cơ cấu xã hội - kinh tế.', 'Cơ cấu xã hội - nghề nghiệp.', 'Cơ cấu xã hội - nhân khẩu.', 'Cơ cấu xã hội - dân cư.'], c: 1 },
{ q: 'Tập hợp những cộng đồng người có cùng đức tin tôn giáo dựa trên nền tảng giáo lí, giáo luật và thực hành các nghi lễ tôn giáo là', a: ['Cơ cấu xã hội - tôn giáo.', 'Cơ cấu xã hội - kinh tế.', 'Cơ cấu xã hội - nhân khẩu.', 'Cơ cấu xã hội - dân cư.'], c: 0 },
{ q: 'Tập hợp những cộng đồng người được hình thành lâu dài trong lịch sử và tương đối ổn định, gắn kết chặt chẽ với nhau về kinh tế, lãnh thổ, văn hóa, ngôn ngữ là nội dung thể hiện khái niệm nào dưới đây?', a: ['Cơ cấu xã hội - dân tộc.', 'Cơ cấu xã hội - kinh tế.', 'Cơ cấu xã hội - nghề nghiệp.', 'Cơ cấu xã hội - nhân khẩu.'], c: 0 },
{ q: 'Bộ phận cơ bản và quan trọng nhất trong cơ cấu xã hội, liên quan trực tiếp đến các đảng phái chính trị, nhà nước, sở hữu tư liệu sản xuất cũng như địa vị xã hội của con người trong hệ thống sản xuất, tổ chức lao động và phân phối lợi ích xã hội là', a: ['Cơ cấu xã hội - nghề nghiệp.', 'Cơ cấu xã hội - nhân khẩu.', 'Cơ cấu xã hội - dân tộc.', 'Cơ cấu xã hội - giai cấp.'], c: 3 },
{ q: 'Để dự báo xu hướng vận động và phát triển của dân số ở những giai đoạn lịch sử nhất định và tác động của nó đến sự phát triển mọi mặt của một quốc gia, cần nghiên cứu cơ cấu xã hội nào dưới đây?', a: ['Cơ cấu xã hội - dân số.', 'Cơ cấu xã hội - nghề nghiệp.', 'Cơ cấu xã hội - tôn giáo.', 'Cơ cấu xã hội - dân tộc.'], c: 0 },
{ q: 'Trong xã hội có giai cấp, cơ cấu nào dưới đây có vị trí quyết định nhất, chi phối các loại hình cơ cấu xã hội khác?', a: ['Cơ cấu xã hội - nghề nghiệp.', 'Cơ cấu xã hội - dân số.', 'Cơ cấu xã hội - giai cấp.', 'Cơ cấu xã hội - dân tộc.'], c: 2 },
{ q: 'Tổng thể các giai cấp, tầng lớp xã hội tồn tại khách quan trong một chế độ xã hội nhất định, thông qua những mối quan hệ về sở hữu tư liệu sản xuất, về tổ chức quản lí quá trình sản xuất, về địa vị chính trị - xã hội,... giữa các giai cấp và tầng lớp, đó là nội dung thể hiện khái niệm nào dưới đây?', a: ['Cơ cấu xã hội - kinh tế.', 'Cơ cấu xã hội - giai cấp.', 'Cơ cấu xã hội - nghề nghiệp.', 'Cơ cấu xã hội - nhân khẩu.'], c: 1 },
{ q: 'Cơ cấu xã hội nào dưới đây đề cập tới mối quan hệ về sở hữu tư liệu sản xuất, về tổ chức quản lí, về địa vị chính trị - xã hội?', a: ['Cơ cấu xã hội - nghề nghiệp.', 'Cơ cấu xã hội - giai cấp.', 'Cơ cấu xã hội - dân cư.', 'Cơ cấu xã hội - tôn giáo.'], c: 1 },
{ q: 'Để xây dựng chính sách phát triển kinh tế, văn hóa, xã hội phù hợp cho từng giai cấp, tầng lớp trong từng giai đoạn lịch sử cụ thể cần căn cứ vào', a: ['Cơ cấu xã hội - giai cấp.', 'Cơ cấu xã hội - nghề nghiệp.', 'Cơ cấu xã hội - dân cư.', 'Cơ cấu xã hội - tôn giáo.'], c: 0 },
{ q: 'Nội dung nào dưới đây không phải là sự biến đổi có tính quy luật của cơ cấu xã hội - giai cấp trong thời kì quá độ lên chủ nghĩa xã hội?', a: ['Cơ cấu xã hội - giai cấp biến đổi gắn liền và bị quy định bởi cơ cấu kinh tế.', 'Cơ cấu xã hội - giai cấp biến đổi phức tạp, đa dạng, làm xuất hiện các tầng lớp xã hội mới.', 'Cơ cấu xã hội - giai cấp biến đổi trong mối quan hệ vừa đấu tranh, vừa liên minh, dẫn đến sự xích lại gần nhau giữa các giai tầng trong xã hội.', 'Cơ cấu xã hội - giai cấp biến đổi và chịu sự tác động của sự biến đổi dân số, tôn giáo.'], c: 3 },
{ q: 'Thời kì quá độ lên chủ nghĩa xã hội có cơ cấu xã hội - giai cấp với nhiều giai cấp, tầng lớp khác nhau vì', a: ['tồn tại nhiều nghề nghiệp và phân công lao động khác nhau.', 'tồn tại nhiều đức tin tôn giáo.', 'tồn tại nhiều dân tộc khác nhau.', 'tồn tại nhiều hình thức sở hữu và nhiều thành phần kinh tế.'], c: 3 },
{ q: 'Trong thời kì quá độ lên chủ nghĩa xã hội, giai cấp, tầng lớp nào dưới đây giữ vai trò chủ đạo trong cơ cấu xã hội - giai cấp?', a: ['Công nhân.', 'Nông dân.', 'Trí thức.', 'Doanh nhân.'], c: 0 },
{ q: 'Sự liên kết, hợp tác, hỗ trợ nhau giữa các giai cấp, tầng lớp chủ yếu có lợi ích cơ bản thống nhất và cũng có thể có lợi ích cơ bản đối kháng là nội dung thể hiện khái niệm nào dưới đây', a: ['Đấu tranh giai cấp.', 'Liên minh giai cấp, tầng lớp.', 'Liên hiệp giai cấp, tầng lớp.', 'Đoàn kết giai cấp, tầng lớp.'], c: 1 },
{ q: 'Sự biến đổi của cơ cấu xã hội - giai cấp gắn liền và được quy định bởi sự biến đổi của cơ cấu nào dưới đây?', a: ['Cơ cấu dân số.', 'Cơ cấu kinh tế.', 'Cơ cấu dân tộc.', 'Cơ cấu dân cư.'], c: 1 },
{ q: '“Trong thời đại chuyên chính vô sản, các giai cấp vẫn tồn tại, nhưng bộ mặt của mỗi một giai cấp đều có thay đổi, quan hệ qua lại giữa các giai cấp cũng biến đối. Cuộc đấu tranh giai cấp chưa chấm dứt dưới thời chuyên chính vô sản, nó chỉ diễn biến ra dưới những hình thức khác mà thôi” là câu nói của', a: ['C. Mác.', 'V.I. Lênin.', 'Ph. Ăngghen.', 'Hồ Chí Minh.'], c: 1 },
{ q: 'Khi khẳng định “một hình thức đặc biệt của liên minh giai cấp giữa giai cấp vô sản, đội tiên phong của người lao động, với đông đảo những tầng lớp lao động không phải vô sản”, V.I. Lênin muốn nói đến khái niệm nào dưới đây?', a: ['Nhà nước.', 'Chuyên chính vô sản.', 'Hiệp hội.', 'Công đoàn.'], c: 1 },
{ q: '“Nếu không liên minh với nông dân thì không thể có được chính quyền của giai cấp vô sản, không thể nghĩ được đến việc duy trì chính quyền đó...” là câu nói của ai?', a: ['C. Mác.', 'V.I. Lênin.', 'Ph. Ăngghen.', 'Hồ Chí Minh.'], c: 1 },
{ q: 'Giai cấp, tầng lớp nào dưới đây được coi là “người bạn đồng minh tự nhiên” của giai cấp công nhân?', a: ['Tư sản.', 'Trí thức.', 'Nông dân.', 'Doanh nhân.'], c: 2 },
{ q: 'Trong luận điểm: “Trước sự liên minh của các đại biểu khoa học, giai cấp vô sản và giới kĩ thuật, không một thế lực đen tối nào đứng vũng được”, V.I. Lênin đã nhấn mạnh tới vai trò của giai cấp, tầng lớp nào dưới đây trong khối liên minh giai cấp?', a: ['Doanh nhân.', 'Trí thức.', 'Tư sản.', 'Nông dân.'], c: 1 },
{ q: 'Theo V.I. Lênin, để giai cấp vô sản giữ được vai trò lãnh đạo và chính quyền nhà nước, nguyên tắc cao nhất của chuyên chính là duy trì khối liên minh giữa', a: ['giai cấp vô sản và tầng lớp doanh nhân.', 'giai cấp nông dân và giai cấp tư sản.', 'giai cấp vô sản và nông dân.', 'tầng lớp doanh nhân và đội ngũ trí thức.'], c: 2 },
{ q: 'Trong quá trình xây dựng chủ nghĩa xã hội, liên minh giữa giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức trong lĩnh vực nào dưới đây giữ vai trò quyết định?', a: ['Chính trị.', 'Văn hóa.', 'Kinh tế.', 'Tư tưởng.'], c: 2 },
{ q: 'Yếu tố nào dưới đây quyết định sự liên minh giữa giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức?', a: ['Mong muốn của giai cấp công nhân.', 'Cùng một kẻ thù là giai cấp tư sản.', 'Có nhũng lợi ích cơ bản thống nhất với nhau.', 'Mục tiêu về chính trị của giai cấp công nhân.'], c: 2 },
{ q: 'Câu nói “Vô sản tất cả các nước và các dân tộc bị áp bức, đoàn kết lại” là của', a: ['C. Mác.', 'Ph.Ăngghen.', 'Hồ Chí Minh.', 'V.I. Lênin.'], c: 3 },
{ q: 'Trong thời kì quá độ lên chủ nghĩa xã hội, các giai cấp, tầng lớp liên minh với nhau trên những lĩnh vực nào dưới đây?', a: ['Kinh tế, chính trị, xã hội.', 'Kinh tế, chính trị, tôn giáo.', 'Kinh tế, văn hóa, xã hội.', 'Kinh tế, chính trị, văn hóa - xã hội.'], c: 3 },
{ q: 'Lực lượng nào dưới đây được Đảng ta coi là lực lượng đặc biệt và chủ trương xây dựng thành lực lượng vững mạnh trong giai đoạn hiện nay?', a: ['Doanh nhân.', 'Trí thức.', 'Thanh niên.', 'Công nhân.'], c: 0 },
{ q: 'Trong thời kì quá độ lên chủ nghĩa xã hội, giai cấp, tầng lớp nào dưới đây có xu hướng giảm dần về số lượng và tỉ lệ trong cơ cấu xã hội giai cấp?', a: ['Nông dân.', 'Trí thức.', 'Công nhân.', 'Doanh nhân.'], c: 0 },
{ q: 'Đảng ta xác định xây dựng vững mạnh giai cấp, tầng lớp nào dưới đây là trực tiếp nâng tầm trí tuệ của dân tộc, sức mạnh của đất nước, nâng cao năng lực lãnh đạo của Đảng và chất lượng hoạt động của hệ thống chính trị?', a: ['Trí thức.', 'Công nhân.', 'Doanh nhân.', 'Thanh niên.'], c: 0 },
{ q: 'Giai cấp, tầng lớp nào dưới đây được coi là rường cột của nước nhà, chủ nhân tương lai của đất nước?', a: ['Thanh niên.', 'Phụ nữ.', 'Trí thức.', 'Doanh nhân.'], c: 0 },
{ q: 'Xét dưới góc độ kinh tế, nội dung nào dưới đây không phải là nguyên nhân của liên minh giai cấp trong thời kì quá độ lên chủ nghĩa xã hội?', a: ['Yêu cầu khách quan của đấu tranh giành chính quyền.', 'Yêu cầu khách quan của quá trình công nghiệp hóa, hiện đại hóa.', 'Sự chuyển dịch cơ cấu kinh tế.', 'Nhu cầu lợi ích kinh tế của các giai cấp, tầng lóp.'], c: 0 },
{ q: 'Sự biến đổi đa dạng, phức tạp của cơ cấu xã hội - giai cấp ở Việt Nam trong thời kì quá độ lên chủ nghĩa xã hội là do', a: ['chuyển đổi cơ chế kinh tế kế hoạch hóa tập trung sang kinh tế thị trường.', 'duy trì cơ chế kế hoạch hóa tập trung quan liêu bao cấp.', 'sự đa dạng của văn hóa, tôn giáo, tín ngưỡng.', 'sự đa dạng về tộc người.'], c: 0 },
{ q: 'Giai cấp, tầng lớp nào hiện nay không còn trong cơ cấu xã hội - giai cấp ở Việt Nam?', a: ['Nông dân.', 'Trí thức.', 'Địa chủ.', 'Công nhân.'], c: 2 },
{ q: 'Nội dung nào dưới đây không phải là vai trò của giai cấp công nhân trong thời kì quá độ lên chủ nghĩa xã hội ở Việt Nam?', a: ['Là giai cấp lãnh đạo.', 'Là giai cấp đại diện cho phương thức sản xuất mới.', 'Là lực lượng lao động sáng tạo đặc biệt.', 'Là lực lượng nòng cốt trong khối liên minh giai cấp.'], c: 2 },
{ q: 'Trong thời kì quá độ lên chủ nghĩa xã hội ở Việt Nam, giai cấp, tầng lớp nào dưới đây được coi là lực lượng lao động sáng tạo đặc biệt quan trọng?', a: ['Nông dân.', 'Doanh nhân.', 'Trí thức.', 'Công nhân.'], c: 2 },

let currentIndex = 0;
let score = 0;
let selections = Array(questions.length).fill(null);
let submitted = Array(questions.length).fill(false);
function initQuiz() {
currentIndex = 0; score = 0;
selections = Array(questions.length).fill(null);
submitted = Array(questions.length).fill(false);
buildNavCircles();
renderQuestion();
document.getElementById("resultBox").style.display = "none";
}
function buildNavCircles() {
  const panel = document.getElementById("navPanel");
  panel.innerHTML = "";
  for (let i = 0; i < questions.length; i++) {
    const c = document.createElement("div");
    c.className = "nav-circle unanswered";
    c.textContent = i + 1;
    c.dataset.index = i;
    c.onclick = () => { currentIndex = +c.dataset.index; renderQuestion(); };
    panel.appendChild(c);
  }
}
function updateNavCircles() {
  const circles = document.querySelectorAll(".nav-circle");
  circles.forEach((c, i) => {
    c.classList.remove("correct", "wrong", "unanswered", "current");
    if (submitted[i]) {
      c.classList.add(selections[i] === questions[i].c ? "correct" : "wrong");
    } else {
      c.classList.add("unanswered");
    }
    if (i === currentIndex) c.classList.add("current");
  });
}
function renderQuestion() {
const q = questions[currentIndex];
document.getElementById("counter").innerText = `Câu ${currentIndex + 1} / ${questions.length}`;
document.getElementById("progress").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
document.getElementById("qText").innerText = q.q;
const optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";
q.a.forEach((opt, i) => {
const div = document.createElement("div");
div.className = "option";
if (selections[currentIndex] === i) div.classList.add("selected");
if (submitted[currentIndex]) {
div.classList.add("disabled");
if (i === q.c) div.classList.add("correct");
if (selections[currentIndex] === i && i !== q.c) div.classList.add("wrong");
}
div.innerHTML = `<input type="radio" name="q" value="${i}" ${selections[currentIndex] === i ? 'checked' : ''}> <span>${String.fromCharCode(65 + i)}. ${opt}</span>`;
div.onclick = () => { if (!submitted[currentIndex]) { selections[currentIndex] = i; renderQuestion(); } };
optionsDiv.appendChild(div);
});
const fb = document.getElementById("fb");
if (submitted[currentIndex]) {
fb.style.display = "block";
fb.style.background = selections[currentIndex] === q.c ? "#e8f5e9" : "#ffebee";
fb.innerHTML = selections[currentIndex] === q.c ? "✅ Chính xác!" : `❌ Sai rồi! Đáp án đúng là <span class="correct-answer">${String.fromCharCode(65 + q.c)}</span>`;
document.getElementById("submitBtn").disabled = true;
document.getElementById("nextBtn").disabled = false;
} else {
fb.style.display = "none";
document.getElementById("submitBtn").disabled = false;
document.getElementById("nextBtn").disabled = true;
}
  if (currentIndex === questions.length - 1 && submitted[currentIndex]) {
    document.getElementById("nextBtn").innerText = "Xem kết quả";
  } else {
    document.getElementById("nextBtn").innerText = "Câu tiếp theo";
  }
  updateNavCircles();
}
document.getElementById("submitBtn").onclick = () => {
  if (selections[currentIndex] === null) return alert("Vui lòng chọn đáp án!");
  submitted[currentIndex] = true;
  if (selections[currentIndex] === questions[currentIndex].c) {
    score++;
    document.getElementById("correctSound").play();
  } else {
    document.getElementById("wrongSound").play();
  }
  renderQuestion();
};
document.getElementById("nextBtn").onclick = () => {
if (currentIndex < questions.length - 1) {
currentIndex++;
renderQuestion();
} else {
const rb = document.getElementById("resultBox");
rb.style.display = "block";
rb.innerHTML = `<h3>Hoàn thành!</h3><p style="font-size:20px;">Bạn đạt được <strong>${score} / ${questions.length}</strong> câu đúng (${((score/questions.length)*10).toFixed(2)} điểm).</p>`;
window.scrollTo(0, document.body.scrollHeight);
}
};
document.getElementById("resetBtn").onclick = () => { if(confirm("Làm mới toàn bộ câu hỏi?")) initQuiz(); };
initQuiz();
</script>
