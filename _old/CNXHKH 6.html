<style>
:root { --bg: #f4f7fb; --card: #ffffff; --text: #1d2433; --muted: #5d6b82; --primary: #1b6ef3; --primary-dark: #0f4fb5; --ok: #16844f; --border: #dce4f3; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(145deg, #ecf3ff 0%, #f8fbff 50%, #eefbf6 100%); color: var(--text); min-height: 100vh; padding: 24px; }
.container { width: min(950px, 100%); margin: 0 auto; }
.header { margin-bottom: 16px; text-align: center; }
h1 { margin: 0; font-size: 24px; color: var(--primary-dark); }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
#progress { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
.card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
.question-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
.options { display: grid; gap: 12px; }
.option { display: flex; align-items: center; padding: 14px 16px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; position: relative; }
.option:hover:not(.disabled) { border-color: var(--primary); background: #f0f6ff; }
.option.selected { border-color: var(--primary); background: #f0f6ff; font-weight: 600; }
.option.correct { border-color: var(--ok); background: #e8f5e9; color: var(--ok); }
.option.wrong { border-color: #d32f2f; background: #ffebee; color: #d32f2f; }
.option input { display: none; }
.controls { margin-top: 24px; display: flex; justify-content: space-between; gap: 12px; }
button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 15px; }
#submitBtn { background: var(--primary); color: white; }
#nextBtn { background: var(--text); color: white; }
#resetBtn { background: #e0e0e0; color: #444; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.feedback { margin-top: 16px; padding: 12px; border-radius: 6px; font-weight: 500; display: none; }
.correct-answer { font-weight: bold; color: var(--ok); }
#resultBox { display: none; margin-top: 24px; text-align: center; padding: 30px; border-radius: 12px; background: white; }
.nav-panel {
  position: fixed; top: 12px; right: 12px;
  background: white; border-radius: 10px; padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  border: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 6px;
  max-width: 200px; max-height: 300px; overflow-y: auto;
  z-index: 1000;
}
.nav-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; border: 2px solid var(--border); background: white; color: var(--text); transition: all 0.15s; user-select: none; }
.nav-circle:hover { transform: scale(1.15); }
.nav-circle.correct { background: #16844f; border-color: #16844f; color: white; }
.nav-circle.wrong { background: #d32f2f; border-color: #d32f2f; color: white; }
.nav-circle.current.correct { background: #0e5c36; border-color: #0e5c36; }
.nav-circle.current.wrong { background: #a12121; border-color: #a12121; }
.nav-circle.current.unanswered { background: #d0d8e8; border-color: #b0bcd4; }
</style>

{ q: 'Nội dung nào dưới đây là nguyên nhân dẫn đến việc hình thành dân tộc có sự khác nhau giữa các khu vực trên thế giới?', a: ['Sự khác nhau về yếu tố kinh tế, xã	 hội và ý thức tộc người.', 'Sự khác nhau về vị trí địa lí, điều kiện tự nhiên.', 'Sự khác nhau về vị trí địa lí, tài nguyên thiên nhiên.', 'Sự khác nhau về vị trí địa lí, điều kiện tự nhiên và ý thức tộc người.'], c: 3 },

{ q: 'Một hình thái ý thức xã hội phản ánh một cách hoang đường hư ảo hiện thực khách quan, thông qua sự phản ánh đó, các lực lượng tự nhiên và xã hội đều trở thành siêu tự nhiên, thần bí là nội dung thể hiện bản chất của khái niệm', a: ['tôn giáo.', 'tín ngưỡng.', 'mê tín dị đoan.', 'văn hóa.'], c: 0 },
{ q: 'Theo Luật Tín ngưỡng, Tôn giáo Việt Nam (2016), niềm tin của con người tồn tại với hệ thống quan niệm và hoạt động bao gồm đối tượng tôn thờ, giáo lí, giáo luật, lễ nghi và tổ chức là nội dung thể hiện khái niệm', a: ['tôn giáo.', 'tín ngưỡng.', 'mê tín dị đoan.', 'hệ thống giáo lí.'], c: 0 },
{ q: 'Niềm tin của con người được thể hiện thông qua những lễ nghi gắn liền với phong tục, tập quán truyền thống để mang lại sự bình an về tinh thần cho cá nhân và cộng đồng là nội dung của khái niệm', a: ['tôn giáo.', 'tín ngưỡng.', 'mê tín.', 'mê tín dị đoan.'], c: 1 },
{ q: 'Trong mối quan hệ với tín ngưỡng, tôn giáo là', a: ['một khái niệm rộng hơn, bao trùm tín ngưỡng.', 'khái niệm nhỏ hơn, là một loại hình (dạng) tín ngưỡng.', 'một khái niệm tương đương tín ngưỡng.', 'một khái niệm hoàn toàn độc lập, không có mối liên hệ.'], c: 1 },
{ q: 'Tin một cách mê muội, mù quáng vào những điều thiếu cơ sở khoa học là biểu hiện của', a: ['tôn giáo.', 'mê tín.', 'tín ngưỡng.', 'dị đoan.'], c: 1 },
{ q: 'Sự suy đoán, hành động 	một cách 	tuỳ tiện với những hành vi sai lệch quá mức, trái với các giá trị văn hóa, đạo đức, pháp luật, gây	 tổn hại cho cá nhân và cộng đồng là biểu hiện của', a: ['tín ngưỡng.', 'dị đoan.', 'tôn giáo.', 'mê tín.'], c: 1 },
{ q: 'Loại hình tôn giáo cổ xưa nhất, thể hiện niềm tin của con người vào một loài động vật, cây cỏ, đồ vật, hiện tượng trong đời sống là nội dung của', a: ['tô tem giáo.', 'ma thuật giáo.', 'sa man giáo.', 'bái vật giáo.'], c: 0 },
{ q: 'Loại hình tôn giáo mà con người thể hiện niềm tin vào khả năng tác động đến các hiện tượng xuất hiện trong tự nhiên, thông qua những hành động như cầu khấn, phù phép, bùa chú là biểu hiện của', a: ['tô tem giáo.', 'ma thuật giáo.', 'sa man giáo.', 'bái vật giáo.'], c: 1 },
{ q: 'Loại hình tôn giáo mà ở đó người ta tôn thờ và có những hành vi thể hiện niềm tin, sự tôn thờ một số vật như hòn đá, gốc cây, bức tường,... Có thể có những thuộc tính siêu nhiên là biểu hiện của', a: ['tô tem giáo.', 'sa man giáo.', 'bái vật giáo.', 'vật linh giáo.'], c: 2 },
{ q: 'Loại hình tôn giáo mà người ta tin rằng các sự vật, hiện tượng trong tự nhiên cũng giống như con người, đều có linh hồn là biểu hiện của', a: ['tô tem giáo.', 'vật linh giáo.', 'ma thuật giáo.', 'sa man giáo.'], c: 1 },
{ q: 'Loại hình tôn giáo sùng bái lãnh tụ, thủ lĩnh, thánh thần bộ lạc hay các tổ chức bộ lạc là biểu hiện của', a: ['tô tem giáo.', 'sa man giáo.', 'vật linh giáo.', 'ma thuật giáo.'], c: 0 },
{ q: 'Nội dung nào dưới đây là đặc điểm của các loại hình tôn giáo trong xã hội nguyên thuỷ?', a: ['Có hệ thống tổ chức và những người hoạt động tôn giáo chuyên nghiệp.', 'Chưa có hệ thống tổ chức và những người hoạt động tôn giáo chuyên nghiệp.', 'Có hệ thống tổ chức nhưng chưa có những người hoạt động tôn giáo chuyên nghiệp.', 'Chưa có hệ thống tổ chức nhưng có những người hoạt động tôn giáo chuyên nghiệp.'], c: 1 },
{ q: 'Tôn giáo nguyên thuỷ phản ánh một thực trạng xã hội mà', a: ['nhận thức của con người quá thấp kém, thậm chí mông muội.', 'mâu thuẫn giai cấp ngày càng sâu sắc.', 'sự áp bức giai cấp bắt đầu xuất hiện.', 'đời sống vật chất, tinh thần của con người còn nhiều khó khăn.'], c: 0 },
{ q: 'Loại hình tôn giáo mà đối tượng thờ phụng là những vị thần của một dân tộc; ảnh hưởng của vị thần đó chỉ giới hạn chủ yếu trong phạm vi một dân tộc nhất định là nội dung thể hiện khái niệm', a: ['tôn giáo vùng miền.', 'tôn giáo dân tộc.', 'tôn giáo khu vực.', 'tôn giáo quốc tế.'], c: 1 },
{ q: 'Đặc trưng nổi bật của tôn giáo dân tộc là', a: ['tính chất dân tộc.', 'tính chất giai cấp.', 'tính chất khu vực.', 'tính chất vùng miền.'], c: 0 },
{ q: 'Vượt ra khỏi phạm vi một dân tộc, một quốc gia, tôn giáo này ảnh hưởng đến nhiều quốc gia, nhiều khu vực khác nhau, thậm chí, toàn thế giới, đây là hình thức', a: ['tôn giáo dân tộc.', 'tôn giáo khu vực và tôn giáo thế giới.', 'tôn giáo khu vực.', 'tôn giáo vùng miền.'], c: 1 },
{ q: 'Đặc trưng nổi bật của tôn giáo khu vực và tôn giáo thế giới là', a: ['tính đa vùng miền, đơn quốc gia.', 'tính đơn dân tộc, đơn quốc gia.', 'tính đa dân tộc, đa quốc gia.', 'tính đơn dân tộc, đa quốc gia.'], c: 2 },
{ q: 'Tôn giáo nào dưới đây ra đời ở Việt Nam', a: ['Đạo Phật.', 'Đạo Hồi.', 'Đạo Cao Đài.', 'Đạo Ki-tô.'], c: 2 },
{ q: 'Tôn giáo nào dưới đây không phải là tôn giáo ra đời ở Việt Nam?', a: ['Tứ Ân Hiếu Nghĩa.', 'Đạo Cao Đài.', 'Đạo Hòa Hảo.', 'Đạo Phật.'], c: 3 },
{ q: 'Nhận định “Tất cả mọi tôn giáo chẳng qua chỉ là sự phản ánh hư ảo - vào trong đầu óc của con người - những lực lượng ở bên ngoài chi phối cuộc sống hằng ngày của họ, chỉ là sự phản ánh trong đó những lực lượng ở trần thế đang mang hình thức những lực lượng siêu trần thế” là của', a: ['C. Mác.', 'V.I. Lênin.', 'Ph. Ăngghen.', 'Hồ Chí Minh.'], c: 2 },
{ q: 'Nhận định: “Tôn giáo là sự tự ý thức và sự tự cảm giác của con người chưa tìm được bản thân mình hoặc đã lại để mất bản thân mình một lần nữa” là của', a: ['C. Mác.', 'Ph. Ăngghen.', 'V.L Lênin.', 'Hồ Chí Minh.'], c: 0 },
{ q: 'Tôn giáo là một hiện tượng xã hội phản ánh sự bất lực và bế tắc của con người trước tự nhiên và xã hội, tuy nhiên, tôn giáo cũng chứa đựng một số giá trị phù hợp với đạo đức, đạo lí của con người là nội dung thể hiện', a: ['nguồn gốc của tôn giáo.', 'bản chất của tôn giáo', 'tính chất của tôn giáo', 'chức năng của tôn giáo.'], c: 1 },
{ q: 'Tôn giáo mang thế giới quan', a: ['duy vật.', 'duy tâm.', 'vừa duy vật, vừa duy tâm.', 'duy vật biện chứng.'], c: 1 },
{ q: 'Nội dung nào dưới đây phản ánh đúng nhất lập trường của những người cộng sản về vấn đề tín ngưỡng, tôn giáo?', a: ['Nhanh chóng xoá bỏ tín ngưỡng, tôn giáo.', 'Luôn tôn trọng quyền tự do tín ngưỡng, tôn giáo của nhân dân.', 'Không quan tâm đến nhu cầu tín ngưỡng, tôn giáo của nhân dân.', 'Sử dụng bạo lực để giải quyết vấn đề tôn giáo.'], c: 1 },
{ q: 'Khi nghiên cứu vấn đề tôn giáo, để tránh quan điểm, tư tưởng, nhận thức có tính cực đoan, ta không được đối lập một cách cực đoan tôn giáo với', a: ['giáo dục.', 'các vấn đề chính trị.', 'khoa học.', 'nền kinh tế thị trường.'], c: 2 },
{ q: 'Nội dung nào sau đây không phải là nguồn gốc dẫn tới sự ra đời của tôn giáo?', a: ['Tự nhiên, kinh tế - xã hội.', 'Nhận thức.', 'Giáo dục', 'Tâm lí'], c: 2 },
{ q: 'Sự bất lực của con người trong cuộc đấu tranh với tự nhiên, xã hội để giải quyết các yêu cầu, các mục đích kinh tế - xã hội, cũng như cuộc sống của bản thân họ là nội dung phản ánh nguồn gốc', a: ['nhận thức của tôn giáo.', 'tâm lí của tôn giáo.', 'tự nhiên, kinh tế - xã hội của tôn giáo.', 'văn hóa của tôn giáo.'], c: 2 },
{ q: 'Sự bần cùng về kinh tế, nạn áp bức về chính trị, sự hiện diện của những bất công xã hội cùng với những thất vọng, bất hạnh trong cuộc đấu tranh của giai cấp bị trị là nội dung phản ánh nguồn gốc', a: ['tự nhiên của tôn giáo.', 'nhận thức của tôn giáo.', 'tâm lí của tôn giáo.', 'kinh tế - xã hội của tôn giáo'], c: 3 },
{ q: 'Câu nói: “Sự bất lực của giai cấp bị bóc lột trong cuộc đấu tranh chống bọn bóc lột tất nhiên đẻ ra lòng tin vào cuộc đời đẹp hơn ở thế giới bên kia, cũng giống y như sự bất lực của con người dã man trong cuộc đấu tranh chống thiên nhiên đẻ ra lòng tin vào thần thánh, ma quỷ và những phép màu...” là của', a: ['G.W.F. Hegel.', 'V.I. Lênin', 'C. Mác.', 'Ph. Ăngghen..'], c: 1 },
{ q: 'Khi khoảng cách giữa biết và chưa biết vẫn tồn tại, khi những điều mà khoa học chưa giải thích được, thì điều này được giải thích thông qua lăng kính các tôn giáo là nội dung của nguồn gốc', a: ['kinh tế - xã hội.', 'tâm lí.', 'nhận thức.', 'văn hóa.'], c: 2 },
{ q: 'Con người chỉ sáng tạo ra tôn giáo khi trình độ nhận thức đạt tới khả năng tư duy', a: ['trừu tượng hóa, khái quát hóa.', 'logic và trừu tượng.', 'tổng hợp và phân tích.', 'chi tiết hóa, trừu tượng hóa.'], c: 0 },
{ q: 'Câu: “Sự sợ hãi sinh ra thần linh” bàn đến nguồn gốc nào dưới đây của tôn giáo?', a: ['Tâm lí.', 'Tự nhiên, kinh tế - xã hội.', 'Nhận thức.', 'Văn hóa.'], c: 0 },
{ q: 'Câu: “Sợ hãi trước các thế lực mù quáng của tư bản, - mù quáng vì quần chúng nhân dân không thể đoán trước được nó, - là thế lực bất cứ lúc nào trong đời sống của người vô sản và người tiểu chủ, cũng đe doạ đem lại cho họ và đang đem lại cho họ sự phá sản “đột ngột”, “bất ngờ”, “ngẫu nhiên”, làm cho họ phải diệt vong, biến họ thành người ăn xin, một kẻ bần cùng, một gái điếm, và dồn họ vào cảnh chết đói, đó chính là nguồn gốc sâu xa của tôn giáo hiện đại” là của', a: ['G.W.F. Hegel.', 'C. Mác.', 'Ph. Ăngghen', 'V.I. Lênin.'], c: 3 },
{ q: 'Không chỉ sự sợ hãi, lo lắng mà ngay cả tình yêu, lòng biết ơn, sự kính trọng,... trong mối quan hệ giữa con người với tự nhiên và con người với con người nhiều khi cũng được thể hiện qua tín ngưỡng, tôn giáo là nội dung thể hiện nguồn gốc nào dưới đây của tôn giáo?', a: ['Nhận thức.', 'Tâm lí.', 'Tự nhiên.', 'Kinh tế - xã hội.'], c: 1 },
{ q: 'Nội dung nào dưới đây không phải là tính chất của tôn giáo?', a: ['Tính lịch sử.', 'Tính quần chúng.', 'Tính logic.', 'Tính chính trị.'], c: 2 },
{ q: 'Tôn giáo có tính chất nào dưới đây?', a: ['Tính logic.', 'Tính khái quát.', 'Tính chính trị.', 'Tính tổng hợp.'], c: 2 },
{ q: 'Tôn giáo hình thành, tồn tại và phát triển trong những giai đoạn lịch sử nhất định, nó có khả năng biến đổi, thích nghi với nhiều chế độ chính trị - xã hội, khi các điều kiện kinh tế, xã hội thay đổi, tôn giáo cũng thay đổi theo là nội dung thể hiện', a: ['tính quần chúng của tôn giáo.', 'tính lịch sử của tôn giáo.', 'tính chính trị của tôn giáo.', 'tính chính trị - lịch sử của tôn giáo.'], c: 1 },
{ q: 'Việc các tôn giáo bị phân liệt, chia tách thành nhiều tôn giáo, nhiều hệ phái khác nhau do sự thay đổi của các điều kiện lịch sử, kinh tế - xã hội phản ánh tính chất nào dưới đây của tôn giáo?', a: ['Tính quần chúng.', 'Tính chính trị.', 'Tính lịch sử.', 'Tính khái quát.'], c: 2 },
{ q: 'Theo quan điểm của chủ nghĩa Mác - Lênin, khi khoa học và giáo dục giúp cho đại đa số quần chúng nhân dân nhận thức được bản chất của các hiện tượng tự nhiên, tôn giáo sẽ', a: ['ngày càng phát triển.', 'biến mất hoàn toàn.', 'trở nên khoa học.', 'dần mất đi vị trí của nó.'], c: 3 },
{ q: 'Tôn giáo là một hiện tượng xã hội phổ biến ở tất cả các dân tộc, quốc gia, châu lục; không một quốc gia dân tộc nào không có một hay nhiều tôn giáo là nội dung thể hiện', a: ['tính quần chúng của tôn giáo.', 'tính phổ biến của tôn giáo.', 'tính quốc tế của tôn giáo.', 'tính chính trị của tôn giáo.'], c: 0 },
{ q: 'Số lượng tín đồ tôn giáo đông đảo, các tôn giáo là nơi sinh hoạt văn hóa, tinh thần của một bộ phận khá đông đảo quần chúng nhân dân là nội dung thể hiện tính chất nào dưới đây của tôn giáo?', a: ['Tính chính trị.', 'Tính xã hội.', 'Tính giai cấp.', 'Tính quần chúng.'], c: 3 },
{ q: 'Khi xã hội có sự phân chia giai cấp, có sự khác biệt, sự đối kháng về lợi ích kinh tế, chính trị giữa các giai cấp thì tôn giáo xuất hiện thêm', a: ['tính chính trị.', 'tính lịch sử.', 'tính quần chúng.', 'tính văn hóa.'], c: 0 },
{ q: 'Nội dung nào dưới đây không phải là chức năng của tôn giáo?', a: ['Kinh tế.', 'Thế giới quan.', 'Đền bù hư ảo.', 'Điều chỉnh hành vi đạo đức.'], c: 0 },
{ q: 'Nội dung nào dưới đây là chức năng của tôn giáo?', a: ['Phát triển xã hội.', 'Kinh tế.', 'Đối nội, đối ngoại.', 'Liên kết cộng đồng và chuyển tải, bảo lưu văn hóa.'], c: 3 },
{ q: 'Tôn giáo giúp con người có những nhận thức nhất định về thế giới và con người, thông qua hệ thống giáo thuyết của nó là nội dung thể hiện chức năng nào dưới đây của tôn giáo?', a: ['Chức năng thế giới quan.', 'Chức năng đền bù hư ảo.', 'Chức năng điều chỉnh hành vi đạo đức.', 'Chức năng liên kết cộng đồng và chuyển tải, bảo lưu văn hóa.'], c: 0 },
{ q: 'Sự phản ánh thế giới của tôn giáo là sự phản ánh có tính chất', a: ['chân thực.', 'hoang đường, hư ảo.', 'khách quan.', 'chân thực, chủ quan.'], c: 1 },
{ q: 'Trong tôn giáo, con người đã biến cái chủ quan thành khách quan, biến cái chỉ tồn tại trong tư duy của mình, trong sự tưởng tượng của mình thành một cái tồn tại ở bên ngoài tư duy của mình và gán cho nó một sức mạnh siêu nhiên là nội dung thể hiện tính chất nào dưới đây trong sự phản ánh thế giới của tôn giáo?', a: ['Chân thực, khách quan.', 'Chân thực, chủ quan.', 'Hoang đường, hư ảo.', 'Khách quan, mơ hồ.'], c: 2 },
{ q: 'Ý nào dưới đây thể hiện đầy đủ nhất nội dung luận điểm của C. Mác: “Tôn giáo là thuốc phiện của nhân dân”?', a: ['Tôn giáo là một liều thuốc có tính chất gây nghiện, tiêm nhiễm cho con người những quan niệm phi khoa học.', 'Tôn giáo làm dịu nỗi đau, bù đắp những thiếu hụt về mặt tinh thần, đồng thời cũng có thể tác động có hại đối với con người.', 'Tôn giáo nguy hiểm như một thứ thuốc phiện, cần loại bỏ ngay ra khỏi đời sống.', 'Tôn giáo giống như thuốc phiện làm cho con người rơi vào trạng thái sống ảo, làm cho con người trở nên thiếu minh mẫn.'], c: 1 },
{ q: 'Tôn giáo điều chỉnh hành vi đạo đức của con người thông qua', a: ['hệ thống giá trị chuẩn mực của tôn giáo.', 'các quy định của pháp luật.', 'các chuẩn mực đạo đức chung của xã hội.', 'hệ thống quy định của địa bàn cư trú.'], c: 0 },
{ q: 'Nội dung nào dưới đây không là biểu hiện của chức năng liên kết cộng đồng và chuyển tải, bảo lưu văn hóa của tôn giáo?', a: ['Liên kết, giữ gìn ổn định trật tự xã hội dựa trên hệ thống giá trị và chuẩn mực chung.', 'Nâng cao đời sống vật chất, tinh thần của đông đảo quần chúng nhân dân.', 'Tập hợp các lực lượng đấu tranh chống áp bức, bóc lột, chống lại các thế lực chính trị - xã hội phản tiến bộ đương thời.', 'Góp phần giao lưu giữa các quốc gia, dân tộc và các nền văn hóa.'], c: 1 },
{ q: 'Nền kinh tế nhiều thành phần vận hành theo cơ chế thị trường với những mặt trái của nó dẫn tới sự bất bình đẳng, sự may rủi, ngẫu nhiên, phân hóa giàu nghèo là nguyên nhân dẫn đến sự tồn tại của tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội ở lĩnh vực', a: ['kinh tế.', 'nhận thức.', 'văn hóa.', 'chính trị - xã hội.'], c: 0 },
{ q: 'Nhiều thế lực vẫn chú ý duy trì và lợi dụng tôn giáo vào các mục đích chính trị khác nhau là nội dung thể hiện nguyên nhân nào dưới đây dẫn tới sự tồn tại của tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội?', a: ['kinh tế.', 'chính trị - xã hội.', 'văn hóa.', 'nhận thức.'], c: 1 },
{ q: 'Nội dung nào dưới đây không là nguyên nhân chính trị - xã hội dẫn tới sự tồn tại của tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội?', a: ['Nền kinh tế nhiều thành phần vận hành theo cơ chế thị trường với nhiều mặt trái của nó.', 'Nhiều thế lực chính trị vẫn chú ý duy trì và lợi dụng tôn giáo vào các mục đích chính trị khác nhau.', 'Nỗi lo sợ của quần chúng nhân dân về chiến tranh, đói nghèo, bệnh tật hiểm nghèo.', 'Tôn giáo tự biến đổi và thích nghi với điều kiện chính trị - xã hội mới để tồn tại.'], c: 0 },
{ q: 'Sinh hoạt tín ngưỡng, tôn giáo có khả năng đáp ứng nhu cầu văn hóa, tinh thần và có ý nghĩa giáo dục về ý thức cộng đồng, đạo đức, phong cách, lối sống là nguyên nhân dẫn tới sự tồn tại của tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội ở lĩnh vực nào dưới đây?', a: ['Kinh tế', 'Văn hóa.', 'Chính trị - xã hội.', 'Tâm lí.'], c: 1 },
{ q: 'Nhiều giá trị của các tôn giáo đang có những đóng góp to lớn và trở thành một bộ phận quan trọng trong nền văn hóa mỗi dân tộc, mỗi quốc gia là nguyên nhân dẫn tới sự tồn tại của tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội ở lĩnh vực nào dưới đây?', a: ['Kinh tế.', 'Văn hóa', 'Chính trị - xã hội.', 'Nhận thức.'], c: 1 },
{ q: 'Còn nhiều vấn đề mà khoa học chưa thể làm rõ; mặt bằng dân trí chưa thật cao, khả năng nhận thức những vấn đề xảy ra trong cuộc sống còn nhiều hạn chế là nguyên nhân dẫn tới sự tồn tại của tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội ở lĩnh vực nào dưới đây?', a: ['Kinh tế.', 'Chính trị.', 'Nhận thức.', 'Văn hóa.'], c: 2 },
{ q: 'Con người đôi khi vẫn cảm thấy sợ hãi, lo lắng, bất an khi đối diện với những tác động bởi sức mạnh tự phát từ tự nhiên, xã hội là nguyên nhân dẫn tới sự tồn tại của tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội ở lĩnh vực nào dưới đây?', a: ['Chính trị', 'Tâm lí.', 'Nhận thức.', 'Kinh tế.'], c: 1 },
{ q: 'Một trong những nguyên tắc cơ bản trong việc giải quyết vấn đề tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội là', a: ['phân biệt hai mặt chính trị và tư tưởng trong giải quyết vấn đề tôn giáo.', 'dần dần loại bỏ tôn giáo ra khỏi đời sống xã hội.', 'kiên quyết đấu tranh với những phần tử, những hoạt động lợi dụng tôn giáo chống phá cách mạng.', 'các tôn giáo đều bình đẳng.'], c: 0 },
{ q: 'Nội dung nào dưới đây không phải là nguyên tắc cơ bản trong việc giải quyết vấn đề tôn giáo trong thời kì quá độ lên chủ nghĩa xã hội?', a: ['Nhân nhượng với những phần tử, những hoạt động lợi dụng tôn giáo chống phá cách mạng.', 'Tôn trọng, đảm bảo quyền tự do tín ngưỡng, tôn giáo và không tín ngưỡng, tôn giáo của quần chúng nhân dân.', 'Khắc phục dần những ảnh hưởng tiêu cực của tôn giáo gắn liền với quá trình cải tạo xã hội cũ, xây dựng xã hội mới, phát huy những mặt tích cực của tôn giáo.', 'Phân biệt hai mặt chính trị và tư tưởng trong việc giải quyết vấn đề tôn giáo.'], c: 0 },
{ q: 'Việc theo đạo, đổi đạo, hay không theo đạo thuộc quyền tự do lựa chọn của mồi người dân, không cá nhân, tổ chức nào được quyền can thiệp vào sự lựa chọn này là nội dung của nguyên tắc', a: ['khắc phục dần những ảnh hưởng tiêu cực của tôn giáo phải gắn liền với quá trình cải tạo xã hội cũ, xây dựng xã hội mới.', 'tôn trọng, bảo đảm quyền tự do tín ngưỡng, tôn giáo và không tín ngưỡng, tôn giáo của quần chúng nhân dân.', 'phân biệt hai mặt chính trị và tư tưởng của tôn giáo.', 'quan điểm lịch sử cụ thể trong việc giải quyết vấn đề tôn giáo.'], c: 1 },
{ q: 'Mọi hành vi cấm đoán, ngăn cản tự do theo đạo, đổi đạo, bỏ đạo hay đe doạ, bắt buộc người dân phải theo đạo đều là', a: ['vi phạm các giá trị đạo đức của cộng đồng.', 'vi phạm quy định của các tổ chức tôn giáo.', 'xâm phạm các giá trị văn hóa.', 'Cả a,b,c,'], c: 3 },
{ q: '“Mọi sự phân biệt quyền lợi giữa công dân có tín ngưỡng, tôn giáo khác nhau là hoàn toàn không thể dung thứ được” là câu nói của', a: ['G.W.F. Hegel.', 'C. Mác.', 'Ph. Ăngghen.', 'V.I. Lênin.'], c: 3 },
{ q: '“Không được tuyên bố chiến tranh với tôn giáo” là câu nói của', a: ['V.I. Lênin.', 'C. Mác.', 'Ph. Ăngghen.', 'Hồ Chí Minh.'], c: 0 },
{ q: 'Để đoàn kết các lực lượng quần chúng có tín ngưỡng, tôn giáo và không tín ngưỡng, tôn giáo, đấu tranh chống các luận điệu vu cáo, các hoạt động lợi dụng tôn giáo chống nhà nước xã hội chủ nghĩa, chúng ta phải đảm bảo nguyên tắc', a: ['tôn trọng, ủng hộ các giáo hội và các chức sắc tôn giáo có ảnh hưởng lớn tới đông đảo nhân dân.', 'ủng hộ các tôn giáo có số lượng tín đồ đông đảo.', 'ủng hộ các tôn giáo dân tộc, bài trừ các tôn giáo khu vực và thế giới.', 'tôn trọng, đảm bảo quyền tự do tín ngưỡng, tôn giáo và không tín ngưỡng, tôn giáo của quần chúng nhân dân.'], c: 3 },
{ q: 'Muốn thay đổi ý thức xã hội, trước hết cần phải thay đổi bản thân tồn tại xã hội; muốn xoá bỏ ảo tưởng nảy sinh trong đầu óc con người, phải xoá bỏ nguồn gốc sinh ra ảo tưởng ấy là cơ sở của nguyên tắc', a: ['khắc phục dần những ảnh hưởng tiêu cực của tôn giáo phải gắn liền với quá trình cải tạo xã hội cũ, xây dựng xã hội mới.', 'tôn trọng, đảm bảo quyền tự do tín ngưỡng và không tín ngưỡng của nhân dân.', 'phân biệt hai mặt chính trị và tư tưởng của tôn giáo.', 'quan điểm lịch sử cụ thể trong giải quyết vấn đề tín ngưỡng, tôn giáo.'], c: 0 },
{ q: 'Theo tư tưởng của chủ nghĩa Mác - Lênin, muốn khắc phục dần những ảnh hưởng tiêu cực của tôn giáo, chúng ta phải', a: ['hạn chế dần ảnh hưởng của tôn giáo, tiến tới xoá bỏ tôn giáo khởi đời sống xã hội.', 'nâng cao trình độ nhận thức của người dân, dần tiến tới xoá bỏ hoàn toàn tôn giáo khỏi đời sống xã hội.', 'xác lập một thế giới hiện thực tốt đẹp không có áp bức, bất công, không nghèo đói và thất nghiệp, không tệ nạn xã hội,...', 'phát triển kinh tế thị trường một cách mạnh mẽ, nâng cao đời sống vật chất cho nhân dân.'], c: 2 },
{ q: 'Hai mặt chính trị và tư tưởng có mối quan hệ với nhau trong vấn đề tôn giáo và trong mỗi tôn giáo khi', a: ['xã hội xuất hiện sản xuất hàng hóa gắn với nhu cầu mở rộng thị trường, mở rộng thuộc địa.', 'xã hội xuất hiện giai cấp, có mâu thuẫn và đấu tranh giai cấp.', 'xã hội chủ nghĩa tư bản chuyển từ giai đoạn tự do cạnh tranh sang giai đoạn độc quyền, tăng cường xâm lược các nước trên thế giới.', 'kinh tế thị trường xuất hiện, lực lượng chính trị lợi dụng tôn giáo để đạt được mục đích của mình.'], c: 1 },
{ q: 'Các thế lực phản động quốc tế đang lợi dụng tôn giáo để thực hiện chiến lược “diễn biến hoà bình” nhằm', a: ['thâu tóm thị trường.', 'chi phối các nước trên thế giới cả về kinh tế, chính trị, văn hóa xã hội.', 'xóa bỏ chế độ xã hội chủ nghĩa ở các nước xã hội chủ nghĩa còn lại.', 'đẩy các nước đang phát triển vào tình trạng lệ thuộc các nước lớn.'], c: 2 },
{ q: 'Để phân biệt được hai mặt chính trị và tư tưởng trong việc giải quyết vấn đề tôn giáo, các đảng cộng sản cần nêu cao tinh thần', a: ['cảnh giác, cương quyết, kịp thời, tránh chủ quan, định kiến.', 'bỏ qua vấn đề tôn giáo khi cần thiết.', 'mọi vấn đề liên quan đến tôn giáo đều phải giải quyết bằng bạo lực.', 'giải quyết vấn đề tôn giáo khi có điều kiện thuận lợi.'], c: 0 },
{ q: 'Tôn giáo không phải là một hiện tượng xã hội bất biến, vì thế khi xem xét và giải quyết vấn đề tôn giáo cần quán triệt', a: ['quan điểm khách quan.', 'quan điểm toàn diện.', 'quan điểm lấy dân làm gốc.', 'quan điểm lịch sử - cụ thể.'], c: 3 },
{ q: 'Nội dung nào dưới đây là đặc điểm cơ bản của tình hình tôn giáo ở Việt Nam?', a: ['Tôn giáo phát triển vô cùng mạnh mẽ.', 'Đa tôn giáo.', 'Hầu như người dân không tham gia các tổ chức tôn giáo.', 'Chỉ có tôn giáo dân tộc.'], c: 1 },
{ q: 'Nội dung nào dưới đây không là đặc điểm cơ bản của tình hình tôn giáo ở Việt Nam?', a: ['Hoạt động tôn giáo không thể kiểm soát.', 'Đa tôn giáo.', 'Đa dạng, đan xen, chung sống hòa bình; không có xung đột, chiến tranh tôn giáo.', 'Các tôn giáo luôn đồng hành cùng dân tộc, có nhiều đóng góp quan trọng trong quá trình xây dựng và bảo vệ đất nước.'], c: 0 },
{ q: 'Tính đến tháng 12/2017, Việt Nam có khoảng bao nhiêu tổ chức tôn giáo được công nhận về mặt tổ chức hoặc đã đăng kí hoạt động?', a: ['Trên 30 tồ chức.', 'Trên 40 tổ chức.', 'Trên 35 tổ chức.', 'Dưới 40 tồ chức.'], c: 1 },
{ q: 'Tính đến tháng 12/2017, Việt Nam có khoảng', a: ['23 triệu tín đồ.', '25 triệu tín đồ.', '24 triệu tín đồ.', '26 triệu tín đồ.'], c: 2 },
{ q: 'Mục đích trong chủ trương đoàn kết những người có tín ngưỡng, không có tín ngưỡng của Chủ tịch Hồ Chí Minh là', a: ['xây dựng khối đại đoàn kết dân tộc.', 'dần xoá bỏ tôn giáo ra khỏi đời sống xã hội.', 'tạo điều kiện thuận lợi cho sự phát triển của tôn giáo.', 'mở rộng giao lưu tôn giáo.'], c: 0 },
{ q: 'Tư tưởng các tôn giáo đều bình đẳng thể hiện thái độ nào dưới đây của Chủ tịch Hồ Chí Minh trong vấn đề tôn giáo?', a: ['Thái độ khách quan, không thiên vị.', 'Thái độ hài hoà, thiên vị.', 'Thái độ chủ quan, duy ý chí.', 'Thái độ khách quan, duy ý chí.'], c: 0 },
{ q: 'Mục đích cao nhất trong tôn trọng quyền tự do tín ngưỡng, tôn giáo của nhân dân theo quan điểm Hồ Chí Minh là', a: ['làm cho tôn giáo phát triển, số lượng tín đồ tôn giáo tăng nhanh.', 'nhân dân được hạnh phúc, lợi ích của đất nước được đảm bảo.', 'tăng nhanh số tín đồ tôn giáo, nâng cao vị thế trong xã hội.', 'phát triển tôn giáo dân tộc.'], c: 1 },
{ q: 'Theo Chủ tịch Hồ Chí Minh, lí tưởng cộng sản và các học thuyết tôn giáo chân chính có điểm chung là đều muốn', a: ['xoá bỏ tình trạng áp bức, bóc lột, bất công, xây dựng cuộc sống hoà bình, hữu nghị.', 'có cuộc sống tốt đẹp sau khi con người từ giã cõi đời.', 'tôn giáo có ảnh hưởng ngày càng lớn trong đời sống xã hội.', 'lí giải mọi vấn đề của đời sống một cách khách quan.'], c: 0 },
{ q: 'Quan điểm: “Tranh thủ những ai có thể tranh thủ được, khoan hồng cho những ai nhẹ dạ cả tin, nhưng đối với bọn ngoan cố chống phá cách mạng thì kiên quyết trừng trị” trong việc giải quyết vấn đề tôn giáo là của', a: ['Hồ Chí Minh.', 'C. Mác.', 'Ph. Ăngghen.', 'Võ Nguyên Giáp.'], c: 0 },

let currentIndex = 0;
let score = 0;
let selections = Array(questions.length).fill(null);
let submitted = Array(questions.length).fill(false);
function initQuiz() {
currentIndex = 0; score = 0;
selections = Array(questions.length).fill(null);
submitted = Array(questions.length).fill(false);
buildNavCircles();
renderQuestion();
document.getElementById("resultBox").style.display = "none";
}
function buildNavCircles() {
  const panel = document.getElementById("navPanel");
  panel.innerHTML = "";
  for (let i = 0; i < questions.length; i++) {
    const c = document.createElement("div");
    c.className = "nav-circle unanswered";
    c.textContent = i + 1;
    c.dataset.index = i;
    c.onclick = () => { currentIndex = +c.dataset.index; renderQuestion(); };
    panel.appendChild(c);
  }
}
function updateNavCircles() {
  const circles = document.querySelectorAll(".nav-circle");
  circles.forEach((c, i) => {
    c.classList.remove("correct", "wrong", "unanswered", "current");
    if (submitted[i]) {
      c.classList.add(selections[i] === questions[i].c ? "correct" : "wrong");
    } else {
      c.classList.add("unanswered");
    }
    if (i === currentIndex) c.classList.add("current");
  });
}
function renderQuestion() {
const q = questions[currentIndex];
document.getElementById("counter").innerText = `Câu ${currentIndex + 1} / ${questions.length}`;
document.getElementById("progress").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
document.getElementById("qText").innerText = q.q;
const optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";
q.a.forEach((opt, i) => {
const div = document.createElement("div");
div.className = "option";
if (selections[currentIndex] === i) div.classList.add("selected");
if (submitted[currentIndex]) {
div.classList.add("disabled");
if (i === q.c) div.classList.add("correct");
if (selections[currentIndex] === i && i !== q.c) div.classList.add("wrong");
}
div.innerHTML = `<input type="radio" name="q" value="${i}" ${selections[currentIndex] === i ? 'checked' : ''}> <span>${String.fromCharCode(65 + i)}. ${opt}</span>`;
div.onclick = () => { if (!submitted[currentIndex]) { selections[currentIndex] = i; renderQuestion(); } };
optionsDiv.appendChild(div);
});
const fb = document.getElementById("fb");
if (submitted[currentIndex]) {
fb.style.display = "block";
fb.style.background = selections[currentIndex] === q.c ? "#e8f5e9" : "#ffebee";
fb.innerHTML = selections[currentIndex] === q.c ? "✅ Chính xác!" : `❌ Sai rồi! Đáp án đúng là <span class="correct-answer">${String.fromCharCode(65 + q.c)}</span>`;
document.getElementById("submitBtn").disabled = true;
document.getElementById("nextBtn").disabled = false;
} else {
fb.style.display = "none";
document.getElementById("submitBtn").disabled = false;
document.getElementById("nextBtn").disabled = true;
}
  if (currentIndex === questions.length - 1 && submitted[currentIndex]) {
    document.getElementById("nextBtn").innerText = "Xem kết quả";
  } else {
    document.getElementById("nextBtn").innerText = "Câu tiếp theo";
  }
  updateNavCircles();
}
document.getElementById("submitBtn").onclick = () => {
  if (selections[currentIndex] === null) return alert("Vui lòng chọn đáp án!");
  submitted[currentIndex] = true;
  if (selections[currentIndex] === questions[currentIndex].c) {
    score++;
    document.getElementById("correctSound").play();
  } else {
    document.getElementById("wrongSound").play();
  }
  renderQuestion();
};
document.getElementById("nextBtn").onclick = () => {
if (currentIndex < questions.length - 1) {
currentIndex++;
renderQuestion();
} else {
const rb = document.getElementById("resultBox");
rb.style.display = "block";
rb.innerHTML = `<h3>Hoàn thành!</h3><p style="font-size:20px;">Bạn đạt được <strong>${score} / ${questions.length}</strong> câu đúng (${((score/questions.length)*10).toFixed(2)} điểm).</p>`;
window.scrollTo(0, document.body.scrollHeight);
}
};
document.getElementById("resetBtn").onclick = () => { if(confirm("Làm mới toàn bộ câu hỏi?")) initQuiz(); };
initQuiz();
</script>
