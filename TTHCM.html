<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz Tư tưởng Hồ Chí Minh</title>
<style>
:root { --bg: #f4f7fb; --card: #ffffff; --text: #1d2433; --muted: #5d6b82; --primary: #1b6ef3; --primary-dark: #0f4fb5; --ok: #16844f; --border: #dce4f3; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(145deg, #ecf3ff 0%, #f8fbff 50%, #eefbf6 100%); color: var(--text); min-height: 100vh; padding: 24px; }
.container { width: min(950px, 100%); margin: 0 auto; }
.header { margin-bottom: 16px; text-align: center; }
h1 { margin: 0; font-size: 24px; color: var(--primary-dark); }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
#progress { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
.card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
.question-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
.options { display: grid; gap: 12px; }
.option { display: flex; align-items: center; padding: 14px 16px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; position: relative; }
.option:hover:not(.disabled) { border-color: var(--primary); background: #f0f6ff; }
.option.selected { border-color: var(--primary); background: #f0f6ff; font-weight: 600; }
.option.correct { border-color: var(--ok); background: #e8f5e9; color: var(--ok); }
.option.wrong { border-color: #d32f2f; background: #ffebee; color: #d32f2f; }
.option input { display: none; }
.controls { margin-top: 24px; display: flex; justify-content: space-between; gap: 12px; }
button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 15px; }
#submitBtn { background: var(--primary); color: white; }
#nextBtn { background: var(--text); color: white; }
#resetBtn { background: #e0e0e0; color: #444; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.feedback { margin-top: 16px; padding: 12px; border-radius: 6px; font-weight: 500; display: none; }
.correct-answer { font-weight: bold; color: var(--ok); }
#resultBox { display: none; margin-top: 24px; text-align: center; padding: 30px; border-radius: 12px; background: white; }
.nav-panel {
  position: fixed; top: 12px; right: 12px;
  background: white; border-radius: 10px; padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  border: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 6px;
  max-width: 200px; max-height: 300px; overflow-y: auto;
  z-index: 1000;
}
.nav-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; border: 2px solid var(--border); background: white; color: var(--text); transition: all 0.15s; user-select: none; }
.nav-circle:hover { transform: scale(1.15); }
.nav-circle.correct { background: #16844f; border-color: #16844f; color: white; }
.nav-circle.wrong { background: #d32f2f; border-color: #d32f2f; color: white; }
.nav-circle.current.correct { background: #0e5c36; border-color: #0e5c36; }
.nav-circle.current.wrong { background: #a12121; border-color: #a12121; }
.nav-circle.current.unanswered { background: #d0d8e8; border-color: #b0bcd4; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>CÂU HỎI TRẮC NGHIỆM<br>TƯ TƯỞNG HỒ CHÍ MINH</h1>
<p id="counter">Câu 1 / 20</p>
</div>
<div class="progress-bar"><div id="progress"></div></div>
<div class="card">
<div id="qText" class="question-text"></div>
<div id="options" class="options"></div>
<div id="fb" class="feedback"></div>
<div class="controls">
<button id="resetBtn">Làm mới</button>
<div style="display:flex; gap:12px;">
<button id="submitBtn">Gửi đáp án</button>
<button id="nextBtn" disabled>Câu tiếp theo</button>
</div>
</div>
</div>
<div id="resultBox" class="card"></div>
</div>
<div id="navPanel" class="nav-panel"></div>
<script>
const questions = [
{ q: "Khái niệm tư tưởng Hồ Chí Minh được trình bày tại Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam (năm 2011) đã nêu bản chất khoa học và cách mạng cũng như nội dung cơ bản của tư tưởng Hồ Chí Minh là:", a: ["Hệ thống luận điểm cụ thể về cách mạng Việt Nam.", "Hệ thống các học thuyết về cách mạng Việt Nam.", "Hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam.", "Hệ thống tư tưởng toàn diện về cách mạng Việt Nam."], c: 2 },
{ q: "Cơ sở phương pháp luận trong nghiên cứu tư tưởng Hồ Chí Minh bao gồm: Thống nhất tính đảng và tính khoa học; thống nhất lý luận và thực tiễn; quan điểm toàn diện và hệ thống; quan điểm kế thừa và phát triển. Quan điểm còn thiếu là?", a: ["Quan điểm vận dụng phương pháp liên ngành khoa học.", "Quan điểm lịch sử - cụ thể.", "Quan điểm phân tích và tổng hợp các sự kiện lịch sử.", "Quan điểm vận dụng phương pháp lôgíc và phương pháp lịch sử."], c: 1 },
{ q: "Đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh là:", a: ["Toàn bộ những quan điểm của Hồ Chí Minh được thể hiện trong di sản của Người.", "Toàn bộ những quan điểm của Hồ Chí Minh được thể hiện trong di sản của Người và quá trình những quan điểm đó được vận động trong thực tiễn.", "Toàn bộ những quan điểm của chủ nghĩa Mác - Lênin mà Hồ Chí Minh đã vận dụng và phát triển sáng tạo.", "Quá trình những quan điểm của Hồ Chí Minh được vận động trong thực tiễn."], c: 1 },
{ q: "Tại Đại hội đại biểu toàn quốc lần thứ VII (năm 1991), Đảng Cộng sản Việt Nam khẳng định: \"Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm...\". Hãy điền vào chỗ trống cụm từ còn thiếu.", a: ["nền tảng tư tưởng, kim chỉ nam cho hành động", "bộ phận quan trọng trong hệ thống đường lối của Đảng", "bộ phận rất quan trọng trong đường lối của Đảng", "bộ phận trong đường lối của Đảng"], c: 0 },
{ q: "Tư tưởng Hồ Chí Minh được hình thành từ cơ sở lý luận nào?", a: ["Chủ nghĩa Mác - Lênin và tinh hoa văn hóa nhân loại.", "Giá trị truyền thống tốt đẹp của dân tộc; tinh hoa văn hóa nhân loại và chủ nghĩa Mác - Lênin.", "Giá trị truyền thống tốt đẹp của dân tộc và tinh hoa văn hóa nhân loại.", "Chủ nghĩa Mác - Lênin."], c: 1 },
{ q: "Khái niệm tư tưởng Hồ Chí Minh được trình bày tại Đại hội đại biểu toàn quốc lần thứ XI (năm 2011) chỉ rõ:", a: ["Tất cả các phương án còn lại.", "Ý nghĩa tư tưởng Hồ Chí Minh.", "Nguồn gốc hình thành tư tưởng Hồ Chí Minh.", "Bản chất khoa học, cách mạng và nội dung cơ bản của tư tưởng Hồ Chí Minh."], c: 0 },
{ q: "Đại hội đại biểu toàn quốc lần thứ mấy của Đảng Cộng sản Việt Nam khẳng định quan điểm chỉ đạo: \"Kiên định và vận dụng phát triển sáng tạo chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh\".", a: ["Đại hội đại biểu toàn quốc lần thứ X (năm 2006).", "Đại hội đại biểu toàn quốc lần thứ XI (năm 2011).", "Đại hội đại biểu toàn quốc lần thứ XII (năm 2016).", "Đại hội đại biểu toàn quốc lần thứ XIII (năm 2021)."], c: 3 },
{ q: "Khi làm việc với đội ngũ cán bộ Ban Tuyên huấn Trung ương, ngày 17 tháng 6 năm 1968, Hồ Chí Minh xác định: Hiểu chủ nghĩa Mác - Lênin có nghĩa là như thế nào?", a: ["Là phải học thuộc các luận điểm lý luận.", "Là phải chứng tỏ trình độ lý luận.", "Là phải sống với nhau có tình có nghĩa.", "Là phải sống với nhau có có trách nhiệm."], c: 2 },
{ q: "Câu sau đây ở trong văn kiện nào: \"Dân tộc ta, nhân dân ta, non sông đất nước ta đã sinh ra Hồ Chủ Tịch, người anh hùng dân tộc vĩ đại, và chính Người đã làm rạng rỡ dân tộc ta, nhân dân ta và non sông đất nước ta\".", a: ["Lời kêu gọi Ban Chấp hành Trung ương Đảng Lao động Việt Nam ngày 3/9/1969.", "Điếu văn của Ban Chấp hành Trung ương Đảng Lao động Việt Nam.", "Tất cả các phương án còn lại đều là sai.", "Bản thông cáo đặc biệt ngày 4/9/1969."], c: 1 },
{ q: "Đối với Hồ Chí Minh, đâu là thế giới quan, phương pháp luận trong nhận thức và hoạt động cách mạng?", a: ["Chủ nghĩa Mác - Lênin.", "Giá trị truyền thống tốt đẹp của dân tộc.", "Tinh hoa văn hóa phương Tây.", "Tinh hoa văn hóa phương Đông."], c: 0 },
{ q: "Đại hội đại biểu toàn quốc lần thứ mấy của Đảng Cộng sản Việt Nam khẳng định: \"Đảng ta phải nắm vững bản chất cách mạng và khoa học của chủ nghĩa Mác - Lênin, kế thừa di sản quý báu về tư tưởng và lý luận cách mạng của Chủ tịch Hồ Chí Minh\".", a: ["Đại hội đại biểu toàn quốc lần thứ XII (năm 2016).", "Đại hội đại biểu toàn quốc lần thứ X (năm 2006).", "Đại hội đại biểu toàn quốc lần thứ XI (năm 2011).", "Đại hội đại biểu toàn quốc lần thứ VI (năm 1986)."], c: 3 },
{ q: "Quan điểm phương pháp luận nào sau đây yêu cầu: Nghiên cứu tư tưởng Hồ Chí Minh cần vận dụng quan điểm của V.I.Lênin về mối quan hệ biện chứng khi xem xét sự vật và hiện tượng trong mối liên hệ lịch sử căn bản?", a: ["Quan điểm cách mạng và khoa học.", "Quan điểm toàn diện và hệ thống.", "Quan điểm kế thừa và phát triển.", "Quan điểm lịch sử - cụ thể."], c: 3 },
{ q: "Phương pháp luận nào sau đây yêu cầu: Nghiên cứu, học tập tư tưởng Hồ Chí Minh đòi hỏi không chỉ biết kế thừa, vận dụng mà còn phải biết phát triển sáng tạo tư tưởng của Hồ Chí Minh trong điều kiện lịch sử mới, trong bối cảnh cụ thể của đất nước và quốc tế?", a: ["Nguyên tắc lý luận gắn liền với thực tiễn.", "Bảo đảm sự thống nhất nguyên tắc tính Đảng và tính khoa học.", "Quan điểm kế thừa và phát triển.", "Quan điểm lịch sử - cụ thể."], c: 2 },
{ q: "Chọn nhận định đúng về khái niệm tư tưởng Hồ Chí Minh.", a: ["Tư tưởng Hồ Chí Minh là sự áp dụng chủ nghĩa Mác - Lênin vào điều kiện thực tế của nước ta.", "Tư tưởng Hồ Chí Minh là kết quả của sự vận dụng sáng tạo chủ nghĩa Mác - Lênin vào điều kiện thực tế của nước ta.", "Tư tưởng Hồ Chí Minh là kết quả của sự phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện thực tế của nước ta.", "Tư tưởng Hồ Chí Minh là kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta."], c: 3 },
{ q: "Khái niệm tư tưởng Hồ Chí Minh được bổ sung, hoàn chỉnh tại Đại hội đại biểu toàn quốc lần thứ mấy của Đảng Cộng sản Việt Nam?", a: ["Đại hội đại biểu toàn quốc lần thứ X (năm 2006).", "Đại hội đại biểu toàn quốc lần thứ XIII (năm 2012).", "Đại hội đại biểu toàn quốc lần thứ XII (năm 2016).", "Đại hội đại biểu toàn quốc lần thứ XI (năm 2011)."], c: 3 },
{ q: "Đâu không phải là phương pháp cụ thể trong nghiên cứu tư tưởng Hồ Chí Minh?", a: ["Phương pháp chuyên ngành, liên ngành.", "Phương pháp phỏng vấn.", "Phương pháp lôgíc, phương pháp lịch sử và sự kết hợp hai phương pháp này.", "Phương pháp phân tích văn bản kết hợp với nghiên cứu hoạt động thực tiễn của Hồ Chí Minh."], c: 1 },
{ q: "Cơ sở lý luận hình thành tư tưởng Hồ Chí Minh không bao gồm:", a: ["Giá trị truyền thống tốt đẹp của dân tộc.", "Tinh hoa văn hóa nhân loại.", "Chủ nghĩa Mác - Lênin.", "Chủ nghĩa Sôvanh."], c: 3 },
{ q: "Tư tưởng Hồ Chí Minh được hình thành từ mấy cơ sở lý luận?", a: ["3", "2", "5", "4"], c: 0 },
{ q: "Ý nghĩa của việc học tập môn học tư tưởng Hồ Chí Minh là:", a: ["Góp phần nâng cao năng lực tư duy lý luận.", "Tất cả các phương án còn lại.", "Giáo dục và định hướng thực hành đạo đức cách mạng, củng cố niềm tin khoa học gắn liền với trau dồi tình cảm cách mạng, bồi dưỡng lòng yêu nước.", "Xây dựng, rèn luyện phương pháp và phong cách công tác."], c: 1 },
{ q: "Cơ sở phương pháp luận trong nghiên cứu tư tưởng Hồ Chí Minh bao gồm: Thống nhất tính đảng và tính khoa học; thống nhất lý luận và thực tiễn; quan điểm lịch sử - cụ thể; quan điểm kế thừa và phát triển. Quan điểm còn thiếu là?", a: ["Quan điểm toàn diện và hệ thống.", "Quan điểm phân tích và tổng hợp các sự kiện lịch sử.", "Quan điểm vận dụng phương pháp liên ngành khoa học.", "Quan điểm vận dụng phương pháp lôgíc và phương pháp lịch sử."], c: 0 }
];
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function shuffleQuestions() {
  for (const q of questions) {
    const idx = Array.from({ length: q.a.length }, (_, i) => i);
    shuffleArray(idx);
    const oldC = q.c;
    q.a = idx.map(i => q.a[i]);
    q.c = idx.indexOf(oldC);
  }
  shuffleArray(questions);
}
let currentIndex = 0;
let score = 0;
let selections = Array(questions.length).fill(null);
let submitted = Array(questions.length).fill(false);
function initQuiz() {
shuffleQuestions();
currentIndex = 0; score = 0;
selections = Array(questions.length).fill(null);
submitted = Array(questions.length).fill(false);
buildNavCircles();
renderQuestion();
document.getElementById("resultBox").style.display = "none";
}
function buildNavCircles() {
  const panel = document.getElementById("navPanel");
  panel.innerHTML = "";
  for (let i = 0; i < questions.length; i++) {
    const c = document.createElement("div");
    c.className = "nav-circle unanswered";
    c.textContent = i + 1;
    c.dataset.index = i;
    c.onclick = () => { currentIndex = +c.dataset.index; renderQuestion(); };
    panel.appendChild(c);
  }
}
function updateNavCircles() {
  const circles = document.querySelectorAll(".nav-circle");
  circles.forEach((c, i) => {
    c.classList.remove("correct", "wrong", "unanswered", "current");
    if (submitted[i]) {
      c.classList.add(selections[i] === questions[i].c ? "correct" : "wrong");
    } else {
      c.classList.add("unanswered");
    }
    if (i === currentIndex) c.classList.add("current");
  });
}
function renderQuestion() {
const q = questions[currentIndex];
document.getElementById("counter").innerText = `Câu ${currentIndex + 1} / ${questions.length}`;
document.getElementById("progress").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
document.getElementById("qText").innerText = q.q;
const optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";
q.a.forEach((opt, i) => {
const div = document.createElement("div");
div.className = "option";
if (selections[currentIndex] === i) div.classList.add("selected");
if (submitted[currentIndex]) {
div.classList.add("disabled");
if (i === q.c) div.classList.add("correct");
if (selections[currentIndex] === i && i !== q.c) div.classList.add("wrong");
}
div.innerHTML = `<input type="radio" name="q" value="${i}" ${selections[currentIndex] === i ? 'checked' : ''}> <span>${String.fromCharCode(65 + i)}. ${opt}</span>`;
div.onclick = () => { if (!submitted[currentIndex]) { selections[currentIndex] = i; renderQuestion(); } };
optionsDiv.appendChild(div);
});
const fb = document.getElementById("fb");
if (submitted[currentIndex]) {
fb.style.display = "block";
fb.style.background = selections[currentIndex] === q.c ? "#e8f5e9" : "#ffebee";
fb.innerHTML = selections[currentIndex] === q.c ? "✅ Chính xác!" : `❌ Sai rồi! Đáp án đúng là <span class="correct-answer">${String.fromCharCode(65 + q.c)}</span>`;
document.getElementById("submitBtn").disabled = true;
document.getElementById("nextBtn").disabled = false;
} else {
fb.style.display = "none";
document.getElementById("submitBtn").disabled = false;
document.getElementById("nextBtn").disabled = true;
}
  if (currentIndex === questions.length - 1 && submitted[currentIndex]) {
    document.getElementById("nextBtn").innerText = "Xem kết quả";
  } else {
    document.getElementById("nextBtn").innerText = "Câu tiếp theo";
  }
  updateNavCircles();
}
document.getElementById("submitBtn").onclick = () => {
  if (selections[currentIndex] === null) return alert("Vui lòng chọn đáp án!");
  submitted[currentIndex] = true;
  if (selections[currentIndex] === questions[currentIndex].c) {
    score++;
    document.getElementById("correctSound").play();
  } else {
    document.getElementById("wrongSound").play();
  }
  renderQuestion();
};
document.getElementById("nextBtn").onclick = () => {
if (currentIndex < questions.length - 1) {
currentIndex++;
renderQuestion();
} else {
const rb = document.getElementById("resultBox");
rb.style.display = "block";
rb.innerHTML = `<h3>Hoàn thành!</h3><p style="font-size:20px;">Bạn đạt được <strong>${score} / ${questions.length}</strong> câu đúng (${((score/questions.length)*10).toFixed(2)} điểm).</p>`;
window.scrollTo(0, document.body.scrollHeight);
}
};
